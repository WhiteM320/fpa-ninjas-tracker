<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FP&A Ninjas — Sogelink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --navy: #0A1628;
  --navy-2: #142240;
  --navy-3: #1E3358;
  --blue: #1B5FA8;
  --blue-2: #2472C8;
  --blue-light: #E8F1FB;
  --blue-mid: #B8D4F5;
  --white: #FFFFFF;
  --bg: #F4F7FC;
  --surface: #FFFFFF;
  --border: #DDE4EF;
  --border-2: #C2CDE0;
  --text: #0A1628;
  --text-2: #4A5878;
  --text-3: #8A96AA;
  --accent: #1B5FA8;
  --gold: #C8960A;
  --gold-bg: #FDF6E0;
  --green: #0E6B4A;
  --green-bg: #E4F5EE;
  --red: #A81B1B;
  --red-bg: #FAEAEA;
  --amber: #8A5200;
  --amber-bg: #FDF2DC;
  --purple: #4A2AB8;
  --purple-bg: #EEEAF8;
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --shadow: 0 1px 4px rgba(10,22,40,0.08);
  --shadow-md: 0 4px 16px rgba(10,22,40,0.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* Topbar */
.topbar { background: var(--navy); border-bottom: 1px solid var(--navy-3); padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 58px; position: sticky; top: 0; z-index: 100; }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 32px; height: 32px; background: var(--blue-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; font-weight: 500; color: #fff; letter-spacing: -0.02em; }
.topbar-names { display: flex; flex-direction: column; }
.topbar-company { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 400; line-height: 1; margin-bottom: 2px; }
.topbar-team { font-size: 13px; color: #fff; font-weight: 500; line-height: 1; }
.topbar-divider { width: 1px; height: 24px; background: var(--navy-3); }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.7); }
.btn-topbar { padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.8); transition: all 0.12s; }
.btn-topbar:hover { background: rgba(255,255,255,0.1); color: #fff; }
.btn-topbar-primary { background: var(--blue-2); border-color: var(--blue-2); color: #fff; }
.btn-topbar-primary:hover { background: #1e84e0; }

/* Main */
.main { padding: 28px; max-width: 1200px; margin: 0 auto; width: 100%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 13px; font-weight: 400; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.12s; }
.btn:hover { background: var(--bg); border-color: var(--border-2); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: var(--blue-2); border-color: var(--blue-2); }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-success:hover { background: #0a5038; }
.btn-danger { color: var(--red); border-color: transparent; background: transparent; padding: 3px 8px; font-size: 12px; }
.btn-danger:hover { background: var(--red-bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-export { background: var(--navy); color: #fff; border-color: var(--navy); font-size: 12px; padding: 6px 12px; }
.btn-export:hover { background: var(--navy-2); }

/* Avatar */
.avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-family: var(--mono); flex-shrink: 0; }

/* Tags */
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
.tag-process { background: var(--purple-bg); color: var(--purple); }
.tag-reporting { background: var(--blue-light); color: var(--blue); }
.badge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.s-ns { background: #EEF0F4; color: #4A5878; }
.s-ip { background: var(--blue-light); color: var(--blue); }
.s-rv { background: var(--amber-bg); color: var(--amber); }
.s-co { background: var(--green-bg); color: var(--green); }
.s-bl { background: var(--red-bg); color: var(--red); }
.prio-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.p-h { background: #E24B4A; } .p-m { background: #EF9F27; } .p-l { background: var(--green); }
.due-ok { color: var(--text-3); font-size: 12px; }
.due-soon { color: var(--amber); font-weight: 500; font-size: 12px; }
.due-over { color: var(--red); font-weight: 500; font-size: 12px; }
.time-chip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; background: var(--blue-light); color: var(--blue); border-radius: 99px; white-space: nowrap; }
.time-chip-log { background: var(--green-bg); color: var(--green); }

/* Summary bar */
.summary-bar { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.sc { display: flex; flex-direction: column; gap: 5px; padding: 0 28px 0 0; margin-right: 28px; border-right: 1px solid var(--border); }
.sc:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.sc-label { font-size: 12px; color: var(--text-3); font-weight: 400; letter-spacing: 0; text-transform: none; font-family: var(--font); }
.sc-val { font-size: 32px; font-weight: 300; letter-spacing: -0.04em; color: var(--text); line-height: 1; }

/* Toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.toolbar input, .toolbar select { font-family: var(--font); font-size: 13px; padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); transition: border-color 0.12s; }
.toolbar input { flex: 1; min-width: 160px; }
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; box-shadow: var(--shadow); transition: box-shadow 0.15s; }
.card:hover { box-shadow: var(--shadow-md); }

/* Project header */
.proj-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; transition: background 0.1s; border-left: 3px solid transparent; }
.proj-header:hover { background: var(--bg); }
.proj-header.process { border-left-color: var(--purple); }
.proj-header.reporting { border-left-color: var(--blue-2); }
.proj-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 120px; }
.chevron { font-size: 10px; color: var(--text-3); transition: transform 0.15s; display: inline-block; }
.chevron.open { transform: rotate(90deg); }
.prog-wrap { width: 64px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-bar { height: 100%; background: var(--blue-2); border-radius: 99px; transition: width 0.3s; }
.prog-bar.done { background: var(--green); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; background: var(--bg); }
.tab { font-size: 12px; padding: 8px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.1s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }

/* Tables */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; padding: 7px 12px; font-size: 11px; font-weight: 500; color: var(--text-2); background: var(--bg); border-bottom: 1px solid var(--border); font-family: var(--mono); letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #F8FAFD; }
.add-row td { background: var(--bg); padding: 6px 10px; }
.add-row input, .add-row select { width: 100%; font-size: 12px; padding: 5px 7px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-family: var(--font); }
.add-row input:focus, .add-row select:focus { outline: none; border-color: var(--blue); }
.mini-sel { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text); font-family: var(--font); width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }

/* Comments */
.comments-section { padding: 14px 18px; }
.comment { display: flex; gap: 10px; margin-bottom: 12px; }
.comment-body { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
.comment-author { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.comment-time { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
.comment-text { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.5; }
.comment-input-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
.comment-input-row textarea { flex: 1; font-family: var(--font); font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: none; min-height: 60px; }
.comment-input-row textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); }

/* Gantt */
.gantt-wrap { overflow-x: auto; padding: 14px 18px; }
.gantt-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.gantt-table th { background: var(--navy); color: rgba(255,255,255,0.7); font-size: 10px; font-family: var(--mono); letter-spacing: 0.04em; padding: 6px 8px; border: none; text-align: center; }
.gantt-table th.name-col { text-align: left; min-width: 180px; background: var(--navy-2); }
.gantt-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
.gantt-table td.name-col { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; background: var(--bg); }
.gantt-bar-cell { padding: 3px 4px; }
.gantt-bar { height: 18px; border-radius: 3px; min-width: 4px; display: inline-block; }
.gantt-bar-ns { background: #C2CDE0; }
.gantt-bar-ip { background: var(--blue-2); }
.gantt-bar-rv { background: #EF9F27; }
.gantt-bar-co { background: var(--green); }
.gantt-bar-bl { background: var(--red); opacity: 0.8; }
.gantt-today { border-left: 2px dashed var(--red); position: relative; }
.gantt-proj-row td { background: var(--navy); color: #fff; font-size: 11px; font-weight: 500; font-family: var(--mono); letter-spacing: 0.02em; }
.gantt-proj-row td.name-col { background: var(--navy-2); }

/* Stakeholders */
.stk-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; }
.stk-card { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
.stk-name { font-size: 13px; font-weight: 500; }
.stk-role-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-family: var(--mono); }
.stk-r { background: var(--blue-light); color: var(--blue); }
.stk-a { background: var(--gold-bg); color: var(--gold); }
.stk-c { background: var(--green-bg); color: var(--green); }
.stk-i { background: #EEF0F4; color: var(--text-2); }
.stk-add { display: flex; gap: 8px; padding: 0 18px 14px; flex-wrap: wrap; align-items: flex-end; }
.stk-add input, .stk-add select { font-family: var(--font); font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }

/* Login */
.login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--navy); padding: 20px; }
.login-brand { text-align: center; margin-bottom: 32px; }
.login-logo-mark { width: 52px; height: 52px; background: var(--blue-2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 16px; font-weight: 500; color: #fff; margin: 0 auto 14px; }
.login-company { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.login-team { font-size: 22px; color: #fff; font-weight: 300; letter-spacing: -0.02em; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 36px; width: 380px; max-width: 100%; box-shadow: var(--shadow-md); }
.login-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-2); margin-bottom: 24px; line-height: 1.5; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select { width: 100%; font-family: var(--font); font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); transition: border-color 0.12s; }
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); background: #fff; }
.login-actions { display: flex; gap: 8px; margin-top: 4px; }

/* My tasks */
.mt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 8px; box-shadow: var(--shadow); transition: box-shadow 0.15s, border-color 0.15s; border-left: 3px solid var(--border); }
.mt-card:hover { box-shadow: var(--shadow-md); border-left-color: var(--blue-2); }
.mt-card.blocked { border-left-color: var(--red); }
.mt-card.complete { border-left-color: var(--green); opacity: 0.7; }
.mt-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.mt-proj { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.mt-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.mt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mt-notes { font-size: 12px; color: var(--text-2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); line-height: 1.5; }
.section-head { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); margin-bottom: 10px; margin-top: 24px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.overdue-flag { background: var(--red-bg); color: var(--red); font-size: 10px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; font-family: var(--mono); }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; color: var(--navy); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(10,22,40,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; width: 520px; max-width: 100%; box-shadow: var(--shadow-md); }
.modal-title { font-size: 16px; font-weight: 500; margin-bottom: 20px; color: var(--navy); }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.fg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 110px; }
.fg label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); }
.fg input, .fg select, .fg textarea { font-family: var(--font); font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); transition: border-color 0.12s; }
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); background: #fff; }
.fg textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.empty { text-align: center; padding: 32px; color: var(--text-3); font-size: 13px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-md); z-index: 999; animation: slideUp 0.2s ease; }
.toast-undo { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: #fff; border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: var(--font); }
.toast-undo:hover { background: rgba(255,255,255,0.15); }
@keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

.date-history { font-size:11px; color:var(--text-3); margin-top:2px; }
.date-history-entry { display:flex; align-items:center; gap:4px; margin-bottom:1px; }
.date-moved { color:var(--amber); }
.date-original { color:var(--text-3); text-decoration:line-through; }
.on-time-badge { font-size:10px; padding:2px 7px; border-radius:99px; font-family:var(--mono); white-space:nowrap; }
.ot-ontime { background:var(--green-bg); color:var(--green); }
.ot-late { background:var(--red-bg); color:var(--red); }
.ot-early { background:var(--blue-light); color:var(--blue); }
.ot-pending { background:#EEF0F4; color:var(--text-2); }
.date-cell { min-width:90px; }
.actual-date { font-size:12px; color:var(--green); font-weight:500; }
.slippage-warn { color:var(--amber); font-size:11px; }
.slippage-bad { color:var(--red); font-size:11px; }

.assignment-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.ap-individual{background:var(--blue-light);color:var(--blue);}
.ap-group{background:var(--green-bg);color:var(--green);}
.ap-subgroup{background:var(--purple-bg);color:var(--purple);}
.watcher-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.watcher-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 8px;font-size:11px;}
.group-badge{background:var(--green-bg);color:var(--green);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.subgroup-badge{background:var(--purple-bg);color:var(--purple);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.onboard-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;}
.onboard-icon{width:44px;height:44px;background:rgba(255,255,255,0.12);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.onboard-body{flex:1;}
.onboard-title{font-size:15px;font-weight:500;margin-bottom:4px;}
.onboard-sub{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5;}
.teams-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
.teams-section h3{font-size:14px;font-weight:500;margin-bottom:14px;color:var(--navy);}
.team-card{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;}
.team-members-wrap{display:flex;gap:-4px;flex-wrap:wrap;gap:4px;}
.assign-mode-sel{font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:var(--font);}

.main-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px;}
.main-tab{font-size:14px;padding:10px 22px;cursor:pointer;color:var(--text-2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .12s;font-weight:400;}
.main-tab:hover{color:var(--text);}

let state=null,currentUser=null,modalHtml=null;

let undoStack = [];
let toastTimer = null;

function pushUndo(type, data) {
  undoStack.push({ type, data });
  if (undoStack.length > 10) undoStack.shift();
}

function showToast(msg, onUndo) {
  const existing = document.getElementById("undo-toast");
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);
  const t = document.createElement("div");
  t.className = "toast"; t.id = "undo-toast";
  t.innerHTML = `<span>${msg}</span><button class="toast-undo" onclick="doUndo()">Undo</button>`;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => { t.remove(); undoStack.pop(); }, 5000);
}


function onTimeStatus(t) {
  if (!t.actualDate) return 'pending';
  if (!t.due) return 'pending';
  const actual = new Date(t.actualDate + 'T00:00:00');
  const target = new Date(t.due + 'T00:00:00');
  const diff = Math.round((actual - target) / 86400000);
  if (diff <= 0) return 'early';
  if (diff <= 3) return 'ontime';
  return 'late';
}
function onTimeBadge(t) {
  if (!t.actualDate) return '<span class="on-time-badge ot-pending">Pending</span>';
  const actual = new Date(t.actualDate + 'T00:00:00');
  const target = new Date(t.due + 'T00:00:00');
  const diff = Math.round((actual - target) / 86400000);
  if (diff < 0) return `<span class="on-time-badge ot-early">Early by ${Math.abs(diff)}d</span>`;
  if (diff === 0) return `<span class="on-time-badge ot-ontime">On time</span>`;
  if (diff <= 3) return `<span class="on-time-badge ot-ontime">+${diff}d</span>`;
  return `<span class="on-time-badge ot-late">+${diff}d late</span>`;
}
function slippageDays(t) {
  if (!t.originalDue || !t.due) return 0;
  return Math.round((new Date(t.due+'T00:00:00') - new Date(t.originalDue+'T00:00:00')) / 86400000);
}
function updateTargetDate(pid, tid, newDue) {
  const p = state.projects.find(x=>x.id===pid);
  const t = p && p.tasks.find(x=>x.id===tid);
  if (!t) return;
  if (t.due === newDue) return;
  const now = new Date();
  const ts = now.toLocaleDateString('en-IE',{day:'numeric',month:'short'}) + ', ' + now.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
  if (!t.dueHistory) t.dueHistory = [];
  t.dueHistory.push({ from: t.due, to: newDue, by: currentUser.name, ts });
  t.due = newDue;
  save(); renderAdmin();
}
function updateActualDate(pid, tid, val) {
  const p = state.projects.find(x=>x.id===pid);
  const t = p && p.tasks.find(x=>x.id===tid);
  if (!t) return;
  t.actualDate = val;
  // Auto-mark complete if actual date set
  if (val && t.status !== 'Complete') { t.status = 'Complete'; }
  save(); renderAdmin();
}

    <div class="celebrate-msg"><span class="celebrate-name">${ownerName}</span> completed <em>${taskName}</em> ahead of schedule. ${msg.msg}</div>
    <button class="celebrate-close" onclick="dismissCelebration()">Keep it up 👊</button>
  `;

  overlay.appendChild(toast);
  document.body.appendChild(overlay);

  // Auto-dismiss after 8 seconds
  setTimeout(() => dismissCelebration(), 8000);
}

function dismissCelebration() {
  const overlay = document.getElementById("celebrate-overlay");
  if (!overlay) return;
  overlay.style.animation = "fadeIn 0.2s ease reverse forwards";
  const toast = overlay.querySelector(".celebrate-toast");
  if (toast) toast.style.animation = "celebrateOut 0.25s ease forwards";
  setTimeout(() => overlay.remove(), 250);
}

function dismissOnboard(name) {
  if (!state.seenOnboard) state.seenOnboard = {};
  state.seenOnboard[name] = true;
  save(); renderMember();
}
function doUndo() {
  const item = undoStack.pop();
  if (!item) return;
  const existing = document.getElementById("undo-toast");
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);
  if (item.type === "project") {
    state.projects.splice(item.data.index, 0, item.data.project);
    save(); renderAdmin();
  } else if (item.type === "task") {
    const p = state.projects.find(x => x.id === item.data.pid);
    if (p) { p.tasks.splice(item.data.index, 0, item.data.task); save(); renderAdmin(); }
  }
}

  };
}

// ── Workflow helpers ──────────────────────────────────────────────────────────
function cadenceBadge(c){return{monthly:"c-monthly",weekly:"c-weekly",quarterly:"c-quarterly","ad hoc":"c-adhoc"}[c]||"c-adhoc";}
function cadenceLabel(c){return{monthly:"Monthly",weekly:"Weekly",quarterly:"Quarterly","ad hoc":"Ad hoc"}[c]||c;}

function calcDueDate(anchorDate, relDay) {
  if(!anchorDate) return "";
  const d = new Date(anchorDate + "T00:00:00");
  d.setDate(d.getDate() + relDay - 1);
  return d.toISOString().slice(0,10);
}

function activeCycle(w) {
  return w.cycles && w.cycles.length ? w.cycles[w.cycles.length-1] : null;
}

function cyclePct(cycle) {
  if(!cycle||!cycle.tasks||!cycle.tasks.length) return 0;
  return Math.round(cycle.tasks.filter(t=>t.status==="Complete").length/cycle.tasks.length*100);
}

function renderWorkflowsView() {
  if(!state.workflows||!state.workflows.length) return `<div class="empty">No workflows yet. Create one with + New workflow.</div>`;
  return state.workflows.map(w => renderWorkflow(w)).join("");
}

function renderWorkflow(w) {
  const ac = activeCycle(w);
  const pp = cyclePct(ac);
  const wfTab = state.activeTab["wf_"+w.id] || "cycle";
  return `<div class="wf-card">
    <div class="wf-header" onclick="toggleWf(${w.id})">
      <span class="chevron ${w.expanded?'open':''}">&#9654;</span>
      <span class="wf-name">${w.name}</span>
      <span class="cadence-badge ${cadenceBadge(w.cadence)}">${cadenceLabel(w.cadence)}</span>
      ${ac?`<span style="font-size:12px;color:var(--text-2)">Cycle: ${fdShort(ac.start)} → ${fdShort(ac.anchor)}</span>`:'<span style="font-size:12px;color:var(--text-3)">No active cycle</span>'}
      ${ac?`<div class="cycle-prog-wrap"><div class="cycle-prog-bar ${pp===100?'done':''}" style="width:${pp}%"></div></div><span style="font-size:12px;color:var(--text-2)">${pp}%</span>`:''}
      <button class="btn btn-sm btn-primary" style="margin-left:4px" onclick="event.stopPropagation();openStartCycle(${w.id})">&#9654; New cycle</button>
      <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteWf(${w.id})">Delete</button>
    </div>
    ${w.expanded?`
    <div class="tabs">
      <div class="tab ${wfTab==='cycle'?'active':''}" onclick="setTab('wf_${w.id}','cycle')">Active cycle${ac?` (${ac.tasks.filter(t=>t.status==='Complete').length}/${ac.tasks.length})`:''}
      </div>
      <div class="tab ${wfTab==='template'?'active':''}" onclick="setTab('wf_${w.id}','template')">Template (${w.template.length} tasks)</div>
      <div class="tab ${wfTab==='history'?'active':''}" onclick="setTab('wf_${w.id}','history')">Cycle history (${w.history.length})</div>
    </div>
    ${wfTab==='cycle'?renderActiveCycle(w,ac)
      :wfTab==='template'?renderTemplate(w)
      :renderHistory(w)}
    `:''}
  </div>`;
}

function renderActiveCycle(w, ac) {
  if(!ac) return `<div class="empty" style="padding:28px">
    No active cycle. Hit <strong>New cycle</strong> to start one.<br>
    <span style="font-size:12px;color:var(--text-3);margin-top:4px;display:block">Tasks will be auto-created from the template with due dates calculated from your anchor date.</span>
  </div>`;
  const rows = ac.tasks.map(t=>`<tr>
    <td style="width:24%">${t.name}</td>
    <td style="width:11%"><span class="chip">${av(t.owner,20)} ${t.owner}</span></td>
    <td style="width:10%"><span class="${dc(t.due,t.status)}">${fdShort(t.due)}</span></td>
    <td style="width:9%"><span class="rel-day">Day ${t.relDay>0?'+':''}${t.relDay}</span></td>
    <td style="width:14%"><select class="mini-sel" onchange="updCycleStatus(${w.id},${t.id},this.value)">${["Not started","In progress","Review","Complete","Blocked"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
    <td style="width:8%"><span class="prio-dot ${pcls(t.priority)}"></span>${t.priority}</td>
    <td style="width:8%;text-align:right"><span class="time-chip">${fh(t.estHrs)}</span></td>
    <td style="width:16%;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.notes||"—"}</td>
  </tr>`).join("");

  const allDone = ac.tasks.every(t=>t.status==="Complete");
  return `
  <div class="cycle-banner">
    <span class="cycle-label">Anchor date</span><span class="cycle-val">${fdShort(ac.anchor)} (${w.anchorLabel})</span>
    <span class="cycle-label" style="margin-left:12px">Started</span><span class="cycle-val">${fdShort(ac.start)}</span>
    <span class="cycle-label" style="margin-left:12px">Tasks complete</span><span class="cycle-val">${ac.tasks.filter(t=>t.status==="Complete").length} / ${ac.tasks.length}</span>
    ${allDone?`<button class="btn btn-success btn-sm" onclick="closeCycle(${w.id})">Close cycle ✓</button>`:""}
  </div>
  <table><thead><tr>
    <th style="width:22%">Task</th><th style="width:10%">Owner</th><th style="width:6%">Geo</th><th style="width:9%">Due date</th><th style="width:8%">Rel. day</th>
    <th style="width:12%">Status</th><th style="width:7%">Priority</th><th style="width:7%;text-align:right">Est</th><th style="width:19%">Notes</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderTemplate(w) {
  const rows = w.template.map(t=>`<tr>
    <td style="width:24%">${t.name}</td>
    <td style="width:11%"><span class="chip">${av(t.owner,20)} ${t.owner}</span></td>
    <td style="width:7%">${geoBadge(t.geo)}</td>
    <td style="width:10%"><span class="rel-day">${t.relDay===0?"Anchor day":t.relDay>0?`Day +${t.relDay}`:`Day ${t.relDay}`}</span></td>

function renderHistory(w) {
  if(!w.history||!w.history.length) return `<div class="empty">No completed cycles yet.</div>`;
  return `<div style="padding:8px 0">${w.history.slice().reverse().map(h=>{
    const late=h.tasks?h.tasks.filter(t=>t.status!=="Complete").length:0;
    const total=h.tasks?h.tasks.length:0;
    const done=total-late;
    const cls=late===0?"hs-ok":late<total/2?"hs-partial":"hs-late";
    return `<div class="history-row">
      <span class="hist-name">${h.label||"Cycle"}</span>
      <span style="font-size:12px;color:var(--text-2)">${fdShort(h.start)} → ${fdShort(h.closed)}</span>
      <span class="hist-stat ${cls}">${done}/${total} complete</span>
      ${late>0?`<span style="font-size:11px;color:var(--amber)">${late} incomplete</span>`:""}
    </div>`;
  }).join("")}</div>`;
}

// ── Workflow actions ──────────────────────────────────────────────────────────
function toggleWf(wid){const w=state.workflows.find(x=>x.id===wid);if(w)w.expanded=!w.expanded;save();renderAdmin();}

function updCycleStatus(wid,tid,val){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const ac=activeCycle(w);if(!ac)return;
  const t=ac.tasks.find(x=>x.id===tid);if(!t)return;
  const wasComplete=t.status==='Complete';
  t.status=val;
  if(val==="Complete"&&!t.actualDate){
    t.actualDate=new Date().toISOString().slice(0,10);
    if(!wasComplete && t.due){
      const target=new Date(t.due+'T00:00:00');
      const actual=new Date(t.actualDate+'T00:00:00');
      const daysEarly=Math.round((target-actual)/86400000);
      if(daysEarly>0){
        setTimeout(()=>showCelebration(t.name,t.owner||currentUser.name,daysEarly),400);
      }
    }
  }
  if(val!=="Complete")t.actualDate="";
  save();renderAdmin();
}

function closeCycle(wid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const ac=activeCycle(w);if(!ac)return;
  ac.closed=new Date().toISOString().slice(0,10);
  ac.label=ac.label||`${w.cadence==="monthly"?"Month":"Cycle"} ending ${fdShort(ac.anchor)}`;
  w.history.push({...ac});
  w.cycles=w.cycles.filter(c=>c.id!==ac.id);
  save();renderAdmin();
  showToast(`Cycle "${ac.label}" closed and archived.`);
}

function openStartCycle(wid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  modalHtml=`<div class="modal-overlay" onclick="if(event.target===this){modalHtml=null;renderAdmin()}">

      <div class="modal-title">Start new cycle — ${w.name}</div>

        <button class="btn" onclick="modalHtml=null;renderAdmin()">Cancel</button>

function startCycle(wid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const anchor=document.getElementById("sc_anchor")?.value;if(!anchor)return;
  const label=document.getElementById("sc_label")?.value.trim();
  const cycleId=Date.now();
  const tasks=w.template.map((t,i)=>({
    ...JSON.parse(JSON.stringify(t)),
    id:cycleId+i,
    due:calcDueDate(anchor,t.relDay),
    status:"Not started",actualDate:"",loggedHrs:0,
    geo:t.geo||"Group"
  }));
  if(!w.cycles)w.cycles=[];
  w.cycles.push({id:cycleId,anchor,start:new Date().toISOString().slice(0,10),label:label||"",tasks});
  w.expanded=true;
  state.activeTab["wf_"+wid]="cycle";
  modalHtml=null;save();renderAdmin();
  showToast(`Cycle started — ${tasks.length} tasks created.`);
}

function addTmplTask(wid){

// ── Assignment helpers ────────────────────────────────────────────────────────
const FULL_GROUP = "__group__";

function getSubgroups() {
  if (!state.subgroups) state.subgroups = [
    { id: 1, name: "Planful Team", members: [] },
    { id: 2, name: "Reporting Squad", members: [] }
  ];
  return state.subgroups;
}

function resolveAssignees(t) {
  // Returns array of member names who should see this task
  if (t.assignMode === "group") return allOwners();
  if (t.assignMode === "subgroup" && t.subgroupId) {
    const sg = getSubgroups().find(s => s.id === t.subgroupId);
    return sg ? sg.members : [];
  }
  return [t.owner].filter(Boolean);
}

function taskVisibleTo(t, name) {
  const assignees = resolveAssignees(t);
  if (assignees.includes(name)) return true;
  if (t.watchers && t.watchers.includes(name)) return true;
  return false;
}

function assignModeLabel(t) {
  if (t.assignMode === "group") return `<span class="assignment-pill ap-group">&#128101; All FP&amp;A Ninjas</span>`;
  if (t.assignMode === "subgroup") {
    const sg = getSubgroups().find(s => s.id === t.subgroupId);
    return `<span class="assignment-pill ap-subgroup">&#128101; ${sg ? sg.name : "Sub-group"}</span>`;
  }
  return `<span class="assignment-pill ap-individual">&#128100; ${t.owner||"Unassigned"}</span>`;
}

function watcherChips(t) {
  if (!t.watchers || !t.watchers.length) return "";
  return `<div class="watcher-row">${t.watchers.map(w=>`<span class="watcher-chip">${av(w,16)} ${w}</span>`).join("")}</div>`;
}

  const sg = getSubgroups().find(s=>s.id===sgId); if(!sg) return;

  if (!checked) sg.members = sg.members.filter(m=>m!==member);
  save();
}

function renderMember(){
  const projTasks=state.projects.flatMap(p=>p.tasks.filter(t=>taskVisibleTo(t,currentUser.name)).map(t=>({...t,pName:p.name,pid:p.id,isWf:false})));
  const wfTasks=myWorkflowTasks(currentUser.name);
  const mine=[...projTasks,...wfTasks];
  const active=mine.filter(t=>t.status!=="Complete"&&t.status!=="Blocked").sort((a,b)=>new Date(a.due||"9999")-new Date(b.due||"9999"));
  const blocked=mine.filter(t=>t.status==="Blocked");
  const done=mine.filter(t=>t.status==="Complete");
  const memberTab = state.memberTab || 'mytasks';

function mCard(t){

  return`<div class="mt-card ${cls}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px">
      <div style="flex:1"><div class="mt-title">${t.name}${dclass==="due-over"&&t.status!=="Complete"?`<span class="overdue-flag">Overdue</span>`:""}</div><div class="mt-proj">${t.pName}</div></div>
      <span class="badge ${scls(t.status)}">${t.status}</span>
    </div>
    <div style="margin-bottom:5px">${assignModeLabel(t)}${watcherChips(t)}</div>
    <div class="mt-meta">
      <span class="${dclass}">Due ${fdShort(t.due)}</span>
      ${t.geo?geoBadge(t.geo):''}
      ${t.estHrs?`<span class="time-chip">Est ${fh(t.estHrs)}</span>`:""}
      ${t.loggedHrs?`<span class="time-chip time-chip-log">Logged ${fh(t.loggedHrs)}</span>`:""}

      <select class="mini-sel" style="width:auto" onchange="t.isWf?updCycleStatus(${t.wfId||0},${t.id},this.value):updStatus(${t.pid},${t.id},this.value)">

  </div>`;
}

function renderAdmin(){
  const search=(document.getElementById("aSearch")||{}).value||"";
  const fSt=(document.getElementById("fSt")||{}).value||"";
  const fTy=(document.getElementById("fTy")||{}).value||"";
  const fOw=(document.getElementById("fOw")||{}).value||"";
  const s=gStats();
  let projs=[...state.projects];
  if(fTy)projs=projs.filter(p=>p.type===fTy);
  const fGeo=(document.getElementById("fGeo")||{}).value||"";
  if(fOw)projs=projs.filter(p=>p.owner===fOw||p.tasks.some(t=>t.owner===fOw));
  if(fGeo)projs=projs.filter(p=>p.tasks.some(t=>t.geo===fGeo));
  if(search){const q=search.toLowerCase();projs=projs.filter(p=>p.name.toLowerCase().includes(q)||p.tasks.some(t=>t.name.toLowerCase().includes(q)||t.owner.toLowerCase().includes(q)));}

  document.getElementById("app").innerHTML=`
  ${topbar()}
  <div class="main">
    <div class="page-header">
      <div class="page-title">FP&amp;A Ninjas</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-export" style="background:var(--green);border-color:var(--green)" onclick="exportExcel()">Export Excel</button>
        <button class="btn" onclick="openManageTeams()">&#128101; Manage teams</button>
        ${state.mainTab==='workflows'?`<button class="btn btn-primary" onclick="openAddWorkflow()">+ New workflow</button>`:`<button class="btn btn-primary" onclick="openAddProj()">+ New project</button>`}
      </div>
    </div>
    <div class="main-tabs">
      <div class="main-tab ${state.mainTab==='dashboard'?'active':''}" onclick="state.mainTab='dashboard';save();renderAdmin()">Dashboard</div>
      <div class="main-tab ${state.mainTab==='projects'?'active':''}" onclick="state.mainTab='projects';save();renderAdmin()">Projects (${state.projects.length})</div>
      <div class="main-tab ${state.mainTab==='workflows'?'active':''}" onclick="state.mainTab='workflows';save();renderAdmin()">Workflows (${(state.workflows||[]).length})</div>
    </div>
    <div class="summary-bar">
      <div class="sc"><div class="sc-label">Projects</div><div class="sc-val">${s.projects}</div></div>
      <div class="sc"><div class="sc-label">Tasks</div><div class="sc-val">${s.tasks}</div></div>
      <div class="sc"><div class="sc-label">Complete</div><div class="sc-val" style="color:var(--green)">${s.done}</div></div>
      <div class="sc"><div class="sc-label">Blocked</div><div class="sc-val" style="color:var(--red)">${s.blocked}</div></div>
      <div class="sc"><div class="sc-label">Overdue</div><div class="sc-val" style="color:var(--amber)">${s.overdue}</div></div>
      ${s.anyEst?`<div class="sc"><div class="sc-label">Est. hrs</div><div class="sc-val">${s.estHrs}</div></div><div class="sc"><div class="sc-label">Logged</div><div class="sc-val">${s.logHrs}</div></div>`:''}
      <div class="sc"><div class="sc-label">On time</div><div class="sc-val" style="color:var(--green)">${s.onTime}</div></div>
      <div class="sc"><div class="sc-label">Late</div><div class="sc-val" style="color:var(--red)">${s.late}</div></div>
    </div>
    ${(state.mainTab!=='workflows'&&state.mainTab!=='dashboard')?`<div class="toolbar">
      <input type="text" id="aSearch" placeholder="Search projects & tasks..." value="${search}" oninput="renderAdmin()" />
      <select id="fSt" onchange="renderAdmin()"><option value="">All statuses</option>${["Not started","In progress","Review","Complete","Blocked"].map(x=>`<option ${fSt===x?"selected":""}>${x}</option>`).join("")}</select>
      <select id="fTy" onchange="renderAdmin()"><option value="">All types</option><option ${fTy==="Process improvement"?"selected":""}>Process improvement</option><option ${fTy==="Reporting improvement"?"selected":""}>Reporting improvement</option></select>
      <select id="fOw" onchange="renderAdmin()"><option value="">All owners</option>${allOwners().map(o=>`<option ${fOw===o?"selected":""}>${o}</option>`).join("")}</select>

    ${state.mainTab==='dashboard'
      ? renderDashboard()
      : state.mainTab==='workflows'
        ? renderWorkflowsView()

    }
  </div>${modalHtml||""}`;
}

function renderProj(p,fSt){
  const pp=pct(p.tasks);
  const tab=state.activeTab[p.id]||"tasks";
  let tasks=[...p.tasks];
  if(fSt)tasks=tasks.filter(t=>t.status===fSt);
  const totE=Math.round(p.tasks.reduce((a,t)=>a+(t.estHrs||0),0)*10)/10;
  const totL=Math.round(p.tasks.reduce((a,t)=>a+(t.loggedHrs||0),0)*10)/10;
  const typeClass=p.type==="Process improvement"?"process":"reporting";

  const taskRows=tasks.map(t=>{
    const expanded=isTaskExpanded(p.id,t.id);
    const subs=t.subtasks||[];const subsDone=subs.filter(x=>x.done).length;
    const subCount=subs.length?`<span style="font-size:10px;font-family:var(--mono);color:var(--text-3);margin-left:3px">${subsDone}/${subs.length}</span>`:'';
    const expandBtn=`<button class="task-expand-btn" onclick="event.stopPropagation();toggleSubtaskPanel(${p.id},${t.id})">${expanded?'▲':'▼'}</button>`;
    const slip=slippageDays(t);
    const slipHtml=slip>0?`<div class="${slip>7?'slippage-bad':'slippage-warn'}">+${slip}d slippage</div>`:(slip<0?`<div style="font-size:11px;color:var(--green)">-${Math.abs(slip)}d</div>`:'');
    const histHtml=(t.dueHistory&&t.dueHistory.length)?`<div class="date-history">${t.dueHistory.map(h=>`<div class="date-history-entry"><span class="date-original">${fdShort(h.from)}</span><span>→</span><span class="date-moved">${fdShort(h.to)}</span><span style="color:var(--text-3);font-size:10px">by ${h.by}</span></div>`).join('')}</div>`:'';
    return `<tr>
    <td style="width:18%">${t.name}</td>
    <td style="width:9%">${assignModeLabel(t)}${watcherChips(t)}</td>
    <td style="width:6%"><select class="mini-sel" style="width:100%;font-size:11px" onchange="updTaskGeo(${p.id},${t.id},this.value)">${['FR','NL','NO','Group'].map(g=>`<option ${(t.geo||'Group')===g?'selected':''}>${g}</option>`).join('')}</select></td>
    <td style="width:9%" class="date-cell">
      <input type="date" value="${t.due||''}" style="font-size:11px;padding:3px 5px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text);width:100%" onchange="updateTargetDate(${p.id},${t.id},this.value)" />
      ${slipHtml}${histHtml}
    </td>
    <td style="width:9%">
      <input type="date" value="${t.actualDate||''}" style="font-size:11px;padding:3px 5px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--green);width:100%" onchange="updateActualDate(${p.id},${t.id},this.value)" />
    </td>
    <td style="width:8%">${onTimeBadge(t)}</td>
    <td style="width:11%"><select class="mini-sel" onchange="updStatus(${p.id},${t.id},this.value)">${["Not started","In progress","Review","Complete","Blocked"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></td>

function renderGantt(p){
  if(!p.tasks.length)return`<div class="empty">No tasks to display.</div>`;
  const allDates=p.tasks.filter(t=>t.due).map(t=>new Date(t.due+"T00:00:00"));
  if(!allDates.length)return`<div class="empty">Add due dates to tasks to see the timeline.</div>`;
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  minD.setDate(minD.getDate()-3);
  maxD.setDate(maxD.getDate()+3);
  const totalDays=Math.max((maxD-minD)/86400000,14);

  const months=[];
  let cur=new Date(minD);
  while(cur<=maxD){
    const label=cur.toLocaleDateString("en-IE",{month:"short",year:"2-digit"});
    if(!months.length||months[months.length-1].label!==label)months.push({label,start:new Date(cur)});
    cur.setDate(cur.getDate()+1);
  }

  const todayOff=Math.max(0,(today-minD)/86400000);
  const todayPct=Math.min(100,todayOff/totalDays*100).toFixed(1);

  const barCls={["Not started"]:"gantt-bar-ns","In progress":"gantt-bar-ip","Review":"gantt-bar-rv","Complete":"gantt-bar-co","Blocked":"gantt-bar-bl"};

  const rows=p.tasks.map(t=>{
    if(!t.due)return`<tr><td class="name-col">${t.name}</td><td colspan="10" style="font-size:11px;color:var(--text-3)">No due date set</td></tr>`;
    const tDate=new Date(t.due+"T00:00:00");
    const endOff=(tDate-minD)/86400000;
    const startOff=Math.max(0,endOff-Math.max(t.estHrs||2,1)/8);
    const barStart=(startOff/totalDays*100).toFixed(1);
    const barWidth=Math.max(1.5,((endOff-startOff)/totalDays*100)).toFixed(1);
    return`<tr>
      <td class="name-col">${t.name}</td>
      <td style="padding:0;position:relative">
        <div style="position:relative;height:28px;width:100%">
          <div style="position:absolute;left:${todayPct}%;top:0;bottom:0;border-left:1.5px dashed var(--red);opacity:0.5;z-index:1"></div>
          <div class="gantt-bar ${barCls[t.status]||"gantt-bar-ns"}" style="position:absolute;left:${barStart}%;width:${barWidth}%;top:5px;height:18px" title="${t.name} — ${t.status} — Due ${fdShort(t.due)}"></div>
        </div>
      </td>
    </tr>`;
  }).join("");

  return`<div class="gantt-wrap">
    <table class="gantt-table">
      <thead><tr>
        <th class="name-col">Task</th>
        <th style="padding:0;position:relative">
          <div style="position:relative;height:24px">
            ${months.map(m=>{
              const off=((m.start-minD)/86400000/totalDays*100).toFixed(1);
              return`<span style="position:absolute;left:${off}%;font-size:10px;white-space:nowrap;padding:4px 6px">${m.label}</span>`;
            }).join("")}
          </div>
        </th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
      ${Object.entries({["Not started"]:"gantt-bar-ns","In progress":"gantt-bar-ip","Review":"gantt-bar-rv","Complete":"gantt-bar-co","Blocked":"gantt-bar-bl"}).map(([k,v])=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2)"><span class="gantt-bar ${v}" style="width:20px;height:10px;border-radius:2px;display:inline-block"></span>${k}</span>`).join("")}
      <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2)"><span style="width:0;border-left:1.5px dashed var(--red);height:14px;display:inline-block;margin:0 4px"></span>Today</span>
    </div>
  </div>`;
}

function toggleProj(pid){const p=state.projects.find(x=>x.id===pid);if(p)p.expanded=!p.expanded;save();renderAdmin();}
function setTab(pid,t){state.activeTab[pid]=t;renderAdmin();}
function updTaskGeo(pid,tid,val){
  const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);
  if(t){t.geo=val;save();renderAdmin();}
}
function updStatus(pid,tid,val){
  const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);
  if(!t)return;
  const wasComplete = t.status==='Complete';
  t.status=val;
  if(val==='Complete' && !t.actualDate){
    const now=new Date();
    t.actualDate=now.toISOString().slice(0,10);
    // Check if completed early
    if(!wasComplete && t.due){
      const target=new Date(t.due+'T00:00:00');
      const actual=new Date(t.actualDate+'T00:00:00');
      const daysEarly=Math.round((target-actual)/86400000);
      if(daysEarly>0){
        const owner=t.owner||currentUser.name;
        setTimeout(()=>showCelebration(t.name,owner,daysEarly),400);
      }
    }
  }
  if(val!=='Complete' && t.actualDate){ t.actualDate=''; }
  save();currentUser.role==="member"?renderMember():renderAdmin();
}
function delTask(pid,tid){
  const p=state.projects.find(x=>x.id===pid); if(!p)return;
  const idx=p.tasks.findIndex(x=>x.id===tid); if(idx===-1)return;
  const task=p.tasks[idx];
  pushUndo("task",{pid,index:idx,task:JSON.parse(JSON.stringify(task))});
  p.tasks.splice(idx,1);
  save(); renderAdmin();
  showToast(`Task "${task.name}" deleted`);
}
function delProj(pid){
  const idx = state.projects.findIndex(x=>x.id===pid);
  if(idx===-1)return;
  const proj = state.projects[idx];
  pushUndo("project", {index: idx, project: JSON.parse(JSON.stringify(proj))});
  state.projects.splice(idx,1);
  save(); renderAdmin();
  showToast(`Project "${proj.name}" deleted`);
}
function delSH(pid,sid){const p=state.projects.find(x=>x.id===pid);if(p){p.stakeholders=p.stakeholders.filter(x=>x.id!==sid);save();renderAdmin();}}

function addTask(pid){
  const n=document.getElementById("nt_n_"+pid)?.value.trim();if(!n)return;
  const p=state.projects.find(x=>x.id===pid);
  const maxId=p.tasks.reduce((m,t)=>Math.max(m,t.id),0);
  const newDue = document.getElementById("nt_d_"+pid).value;
  const geoEl = document.getElementById("nt_g_"+pid);
  p.tasks.push({id:Math.max(maxId+1,state.nextTid++),name:n,owner:document.getElementById("nt_o_"+pid).value,due:newDue,originalDue:newDue,dueHistory:[],actualDate:'',status:document.getElementById("nt_s_"+pid).value,priority:document.getElementById("nt_p_"+pid).value,geo:geoEl?geoEl.value||"Group":"Group",estHrs:parseFloat(document.getElementById("nt_e_"+pid).value)||0,loggedHrs:parseFloat(document.getElementById("nt_l_"+pid).value)||0,notes:""});
  save();renderAdmin();
}
function addSH(pid){
  const n=document.getElementById("ns_n_"+pid)?.value.trim();if(!n)return;
  const p=state.projects.find(x=>x.id===pid);
  const maxId=(p.stakeholders||[]).reduce((m,s)=>Math.max(m,s.id),0);
  if(!p.stakeholders)p.stakeholders=[];
  p.stakeholders.push({id:maxId+1,name:n,role:document.getElementById("ns_r_"+pid).value});
  document.getElementById("ns_n_"+pid).value="";
  save();renderAdmin();
}
function addComment(pid){
  const el=document.getElementById("cmt_"+pid);if(!el)return;
  const text=el.value.trim();if(!text)return;
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.comments)p.comments=[];
  const now=new Date();
  const ts=now.toLocaleDateString("en-IE",{day:"numeric",month:"short"})+", "+now.toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit"});
  const maxId=p.comments.reduce((m,c)=>Math.max(m,c.id),0);
  p.comments.push({id:maxId+1,author:currentUser.name,text,ts});
  save();renderAdmin();
}

function exportExcel() {
  const wb = XLSX.utils.book_new();

  // ── Sheet 1: Project summary ─────────────────────────────────────────────
  const summaryRows = [
    ["FP&A Ninjas — Project Tracker", "", "", "", "", ""],
    ["Exported", new Date().toLocaleDateString("en-IE"), "", "", "", ""],
    [],
    ["Project", "Type", "Owner", "Target date", "Progress %", "Est hrs", "Logged hrs", "Blocked tasks", "Overdue tasks"]
  ];
  state.projects.forEach(p => {
    const tasks = p.tasks;
    const pp = tasks.length ? Math.round(tasks.filter(t=>t.status==="Complete").length/tasks.length*100) : 0;
    const estHrs = tasks.reduce((a,t)=>a+(t.estHrs||0),0);
    const logHrs = tasks.reduce((a,t)=>a+(t.loggedHrs||0),0);
    const blocked = tasks.filter(t=>t.status==="Blocked").length;
    const overdue = tasks.filter(t=>{if(!t.due||t.status==="Complete")return false;return new Date(t.due+"T00:00:00")<new Date();}).length;
    summaryRows.push([p.name, p.type, p.owner, p.due||"", pp+"%", estHrs, logHrs, blocked, overdue]);
  });
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:40},{wch:24},{wch:16},{wch:14},{wch:12},{wch:10},{wch:10},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsSummary, "Project Summary");

  // ── Sheet 2: Full task list ──────────────────────────────────────────────
  const taskRows = [
    ["Project", "Type", "Task", "Owner", "Geography", "Original target", "Target date", "Actual date", "Date changes", "Status", "Priority", "Est hrs", "Logged hrs", "On time", "Notes"]
  ];
  state.projects.forEach(p => {
    p.tasks.forEach(t => {
      const slip = t.originalDue && t.due ? Math.round((new Date(t.due+"T00:00:00")-new Date(t.originalDue+"T00:00:00"))/86400000) : 0;
      const history = (t.dueHistory||[]).map(h=>`${h.from}→${h.to} (${h.by})`).join("; ");

      taskRows.push([
        p.name, p.type, t.name, t.owner, t.geo||"Group",

        history||"", t.status, t.priority,
        t.estHrs||0, t.loggedHrs||0, onTime, t.notes||""

    });

    ["Timeline — sorted by target date", "", "", "", "", ""],
    [],
    ["Due date", "Project", "Task", "Owner", "Geography", "Status", "Priority", "Days to deadline", "Est hrs", "Notes"]
  ];
  const allTasks = state.projects.flatMap(p=>p.tasks.map(t=>({...t,projectName:p.name})));
  allTasks.sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const today = new Date(); today.setHours(0,0,0,0);

    const daysTo = t.due ? Math.round((new Date(t.due+"T00:00:00")-today)/86400000) : "";

    ]);

  wsTimeline['!cols'] = [{wch:12},{wch:36},{wch:40},{wch:14},{wch:8},{wch:14},{wch:10},{wch:14},{wch:8},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsTimeline, "Timeline");

  // ── Sheet 4: Cashflow project deep-dive ──────────────────────────────────
  const cf = state.projects.find(p=>p.name.toLowerCase().includes("cashflow"));
  if (cf) {
    const cfRows = [
      ["Cashflow reporting via Planful — Task detail"],
      ["Target go-live", cf.due, "", "Owner", cf.owner],
      [],
      ["#", "Phase", "Task", "Due date", "Status", "Priority", "Est hrs", "Risk notes"]
    ];

function ragStatus(p){
  const tasks=p.tasks; if(!tasks.length)return'amber';
  const blocked=tasks.filter(t=>t.status==='Blocked').length;
  const overdue=tasks.filter(t=>{if(!t.due||t.status==='Complete')return false;return new Date(t.due+'T00:00:00')<today;}).length;
  const pp=Math.round(tasks.filter(t=>t.status==='Complete').length/tasks.length*100);
  if(blocked>0||overdue>2)return'red';
  if(overdue>0||pp<20)return'amber';
  return'green';
}

// ── Date change reason ─────────────────────────────────────────────────────
let _pendingDateChange=null;

function updateTargetDate(pid,tid,newDue){
  const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);
  if(!t||t.due===newDue)return;
  if(!t.due){applyDateChange(pid,tid,newDue,'Initial date set');return;}
  if(newDue>t.due){_pendingDateChange={pid,tid,newDue,oldDue:t.due};showDateReasonModal(t.name,t.due,newDue);}
  else{applyDateChange(pid,tid,newDue,'Date moved earlier');}
}
function showDateReasonModal(taskName,oldDue,newDue){
  const overlay=document.createElement('div');overlay.className='date-reason-overlay';overlay.id='date-reason-overlay';
  overlay.innerHTML=`<div class="date-reason-modal"><h3>Why is this date moving?</h3><p>Moving <strong>${taskName}</strong> from <strong>${fdShort(oldDue)}</strong> to <strong>${fdShort(newDue)}</strong>. Please give a brief reason — this is logged in the date history.</p><input type="text" id="date-reason-input" placeholder="e.g. Waiting on ERP SME availability..." maxlength="120" /><div class="date-reason-actions"><button class="btn" onclick="cancelDateChange()">Cancel</button><button class="btn btn-primary" onclick="confirmDateChange()">Confirm</button></div></div>`;
  overlay.onclick=function(e){if(e.target===overlay)cancelDateChange();};
  document.body.appendChild(overlay);
  setTimeout(()=>{const el=document.getElementById('date-reason-input');if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')confirmDateChange();});}},50);
}
function cancelDateChange(){const el=document.getElementById('date-reason-overlay');if(el)el.remove();_pendingDateChange=null;renderAdmin();}
function confirmDateChange(){
  const el=document.getElementById('date-reason-input');const reason=el?el.value.trim():'';
  if(!reason){if(el){el.style.borderColor='var(--red)';el.placeholder='Please enter a reason...';}return;}
  document.getElementById('date-reason-overlay')?.remove();
  if(_pendingDateChange){applyDateChange(_pendingDateChange.pid,_pendingDateChange.tid,_pendingDateChange.newDue,reason);_pendingDateChange=null;}
}
function applyDateChange(pid,tid,newDue,reason){
  const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;
  const now=new Date();const ts=now.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+', '+now.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
  if(!t.dueHistory)t.dueHistory=[];
  t.dueHistory.push({from:t.due,to:newDue,by:currentUser.name,ts,reason});
  t.due=newDue;save();renderAdmin();
}

function toggleSubtaskDone(pid,tid,sid){

function renderThread(){

  }).join(''):`<div class="tn-empty">No notes yet.</div>`;

  setTimeout(()=>{const b=document.getElementById('thread-body');if(b)b.scrollTop=b.scrollHeight;},50);

function handleThreadInput(ta){
  const val=ta.value;const cursor=ta.selectionStart;const textBefore=val.slice(0,cursor);
  const atMatch=textBefore.match(/@([\w ]*)$/);const dd=document.getElementById('mention-dropdown');
  if(atMatch){const query=atMatch[1].toLowerCase();const matches=allOwners().filter(o=>o.toLowerCase().includes(query)&&o!==currentUser.name);if(matches.length){dd.style.display='block';dd.innerHTML=matches.map(m=>`<div class="mention-item" onmousedown="insertMention('${m}')">${av(m,22)} ${m}</div>`).join('');return;}}
  dd.style.display='none';
}
function insertMention(name){const ta=document.getElementById('thread-input-ta');if(!ta)return;const val=ta.value;const cursor=ta.selectionStart;const replaced=val.slice(0,cursor).replace(/@([\w ]*)$/,'@'+name+' ');ta.value=replaced+val.slice(cursor);ta.focus();ta.setSelectionRange(replaced.length,replaced.length);document.getElementById('mention-dropdown').style.display='none';}
function handleThreadKey(e){const dd=document.getElementById('mention-dropdown');if(dd&&dd.style.display!=='none'){if(e.key==='Escape')dd.style.display='none';return;}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postThreadNote();}}
function postThreadNote(){
  const ta=document.getElementById('thread-input-ta');if(!ta)return;const text=ta.value.trim();if(!text)return;
  const t=getThreadTask();if(!t)return;if(!t.taskNotes)t.taskNotes=[];
  const mentions=[];const re=/@([\w][\w .]+)/g;let m;while((m=re.exec(text))!==null){const name=m[1].trim();if(allOwners().includes(name)&&!mentions.includes(name))mentions.push(name);}
  const now=new Date();const ts=now.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+', '+now.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
  const maxId=t.taskNotes.reduce((mx,n)=>Math.max(mx,n.id),0);
  const newNote={id:maxId+1,author:currentUser.name,text,ts,tagged:mentions};
  t.taskNotes.push(newNote);ta.value='';document.getElementById('mention-dropdown').style.display='none';save();renderThread();
  if(mentions.length)showToast(`Note posted — tagged ${mentions.join(', ')}`);else showToast('Note posted');
  if(looksLikeFrench(text)){showToast('🇫🇷 French detected — translating...');autoTranslateNote(_threadPid,_threadTid,newNote.id);}
}
function myTagCount(){if(!currentUser)return 0;return state.projects.flatMap(p=>p.tasks).reduce((count,t)=>{return count+(t.taskNotes||[]).filter(n=>(n.tagged||[]).includes(currentUser.name)&&n.author!==currentUser.name).length;},0);}

// ── French translation ─────────────────────────────────────────────────────
const FR_WORDS=['le','la','les','un','une','des','est','sont','dans','avec','pour','sur','par','que','qui','pas','plus','très','nous','vous','ils','elles','mais','donc','aussi','comme','tout','cette','être','avoir','faire','aller','voir','venir','bien','même','encore','après','avant','depuis','pendant','selon','entre'];
function looksLikeFrench(text){if(!text||text.length<8)return false;const words=text.toLowerCase().split(/\s+/);const fr=words.filter(w=>FR_WORDS.includes(w.replace(/[^a-zàâéèêëîïôùûüç]/g,''))).length;const hasAccents=/[àâéèêëîïôùûüçÀÂÉÈÊËÎÏÔÙÛÜÇ]/.test(text);return hasAccents||(words.length>=3&&fr>=2);}
async function translateToEnglish(text){try{const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:`Translate the following French text to English. Reply with ONLY the English translation, nothing else:

${text}`}]})});const data=await resp.json();return data.content?.[0]?.text?.trim()||null;}catch(e){return null;}}
async function translateComment(pid,tid,noteId,btnEl){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;const note=(t.taskNotes||[]).find(n=>n.id===noteId);if(!note)return;if(note.translation){delete note.translation;save();renderThread();return;}btnEl.textContent='Translating...';const result=await translateToEnglish(note.text);if(result){note.translation=result;save();renderThread();}else{btnEl.textContent='Failed';}}
async function autoTranslateNote(pid,tid,noteId){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;const note=(t.taskNotes||[]).find(n=>n.id===noteId);if(!note||note.translation)return;const result=await translateToEnglish(note.text);if(result){note.translation=result;save();renderThread();}}
async function translateTaskName(pid,tid,btnEl){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;if(t.translatedName){delete t.translatedName;save();renderAdmin();return;}btnEl.textContent='Translating...';const result=await translateToEnglish(t.name);if(result){t.translatedName=result;save();renderAdmin();}else{btnEl.textContent='Failed';}}

// ── Backup & restore ───────────────────────────────────────────────────────
function exportDataBackup(){
  const backup={version:'sogelink_fpa_v1',exported:new Date().toISOString(),exportedBy:currentUser?currentUser.name:'Unknown',data:state};
  const json=JSON.stringify(backup,null,2);
  const existing=document.getElementById('backup-modal-overlay');if(existing)existing.remove();
  const overlay=document.createElement('div');overlay.id='backup-modal-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(10,22,40,0.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px';
  overlay.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;width:540px;max-width:100%;box-shadow:var(--shadow-md);max-height:85vh;display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:15px;font-weight:500;color:var(--navy)">💾 Data backup</div><button onclick="document.getElementById('backup-modal-overlay').remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-3)">×</button></div><div style="font-size:13px;color:var(--text-2);line-height:1.5">Click <strong>Copy to clipboard</strong>, then open Notepad, paste and save as <strong>fpa_ninjas_backup_${new Date().toISOString().slice(0,10)}.json</strong></div><div style="display:flex;gap:8px;align-items:center"><button id="backup-copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('backup-json-text').value).then(()=>{this.textContent='✓ Copied!';this.style.background='var(--green)';}).catch(()=>{document.getElementById('backup-json-text').select();document.execCommand('copy');this.textContent='✓ Copied!';})" style="background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 18px;font-size:13px;cursor:pointer;font-family:var(--font);font-weight:500">Copy to clipboard</button><span style="font-size:12px;color:var(--text-3)">${new Date().toLocaleDateString('en-IE')}</span></div><textarea id="backup-json-text" readonly style="flex:1;min-height:220px;max-height:340px;font-family:monospace;font-size:11px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#F8F9FA;color:var(--text);resize:none;overflow-y:auto">${json.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea></div>`;
  document.body.appendChild(overlay);overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
}
function openImportModal(){
  const overlay=document.createElement('div');overlay.className='import-overlay';overlay.id='import-overlay';overlay.onclick=function(e){if(e.target===overlay)closeImportModal();};
  overlay.innerHTML=`<div class="import-modal"><h3>Restore from backup</h3><p>Select a backup JSON file previously exported from this tracker.</p><div class="import-drop" id="import-drop" onclick="document.getElementById('import-file-input').click()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleImportDrop(event)"><div style="font-size:28px;margin-bottom:8px">📂</div><div class="import-drop-label">Click to select backup file</div><div class="import-drop-sub">or drag and drop your .json backup here</div></div><input type="file" id="import-file-input" accept=".json" style="display:none" onchange="handleImportFile(this)" /><div class="import-actions"><button class="btn" onclick="closeImportModal()">Cancel</button></div></div>`;
  document.body.appendChild(overlay);
}
function closeImportModal(){document.getElementById('import-overlay')?.remove();}
function handleImportDrop(e){e.preventDefault();document.getElementById('import-drop').classList.remove('dragover');const file=e.dataTransfer.files[0];if(file)processImportFile(file);}
function handleImportFile(input){const file=input.files[0];if(file)processImportFile(file);}
function processImportFile(file){
  if(!file.name.endsWith('.json')){showToast('Please select a .json backup file');return;}
  const reader=new FileReader();
  reader.onload=function(e){try{const backup=JSON.parse(e.target.result);if(!backup.data||!backup.data.projects){showToast('Invalid backup file');return;}const pc=backup.data.projects.length;const tc=backup.data.projects.flatMap(p=>p.tasks).length;const ed=backup.exported?new Date(backup.exported).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'}):'unknown';if(confirm(`Restore backup from ${ed}?\n\n${pc} projects, ${tc} tasks.\n\nThis replaces your current data.`)){state=backup.data;localStorage.setItem('sogelink_fpa_live',JSON.stringify(state));closeImportModal();render();showToast(`✓ Backup restored — ${pc} projects, ${tc} tasks`);}}catch(err){showToast('Could not read backup file');}};
  reader.readAsText(file);
}

// ── Weekly digest ──────────────────────────────────────────────────────────
function exportWeeklyDigest(){
  const now=new Date();const weekStr=now.toLocaleDateString('en-IE',{day:'numeric',month:'long',year:'numeric'});
  const in7=new Date(now);in7.setDate(in7.getDate()+7);const todayD=new Date();todayD.setHours(0,0,0,0);
  const allTasks=state.projects.flatMap(p=>p.tasks.map(t=>({...t,pName:p.name})));
  const dueSoon=allTasks.filter(t=>t.status!=='Complete'&&t.due&&new Date(t.due+'T00:00:00')<=in7&&new Date(t.due+'T00:00:00')>=todayD).sort((a,b)=>a.due.localeCompare(b.due));
  const overdueTasks=allTasks.filter(t=>t.status!=='Complete'&&t.due&&new Date(t.due+'T00:00:00')<todayD);
  const blockedTasks=allTasks.filter(t=>t.status==='Blocked');
  const completedThisWeek=allTasks.filter(t=>{if(!t.actualDate)return false;const d=new Date(t.actualDate+'T00:00:00');const wk=new Date(now);wk.setDate(wk.getDate()-7);return d>=wk;});
  const s=gStats();
  let html2=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FP&A Ninjas Weekly Digest ${weekStr}</title><style>body{font-family:'Segoe UI',Arial,sans-serif;max-width:700px;margin:0 auto;padding:32px 24px;color:#0A1628;}h1{font-size:22px;font-weight:300;letter-spacing:-0.02em;margin-bottom:4px;}h2{font-size:14px;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid #E5E7EB;}table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}th{text-align:left;padding:6px 10px;background:#F4F7FC;font-size:11px;font-weight:600;text-transform:uppercase;color:#6B7280;}td{padding:8px 10px;border-bottom:1px solid #F0F0F0;}.green{background:#E4F5EE;color:#0E6B4A;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:500;}.amber{background:#FDF2DC;color:#8A5200;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:500;}.red{background:#FAEAEA;color:#A81B1B;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:500;}.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}.stat{background:#F4F7FC;border-radius:8px;padding:12px 16px;text-align:center;min-width:80px;}.stat-val{font-size:24px;font-weight:300;}.stat-label{font-size:11px;color:#6B7280;}</style></head><body>
  <div style="font-size:11px;letter-spacing:0.06em;color:#1B5FA8;font-weight:600;margin-bottom:6px">SOGELINK · FP&A NINJAS</div>
  <h1>Weekly Project Digest</h1><div style="font-size:13px;color:#6B7280;margin-bottom:28px">Week of ${weekStr}</div>
  <div class="stat-row"><div class="stat"><div class="stat-val">${s.projects}</div><div class="stat-label">Projects</div></div><div class="stat"><div class="stat-val">${s.tasks}</div><div class="stat-label">Tasks</div></div><div class="stat"><div class="stat-val" style="color:#0E6B4A">${s.done}</div><div class="stat-label">Complete</div></div><div class="stat"><div class="stat-val" style="color:#A81B1B">${s.blocked}</div><div class="stat-label">Blocked</div></div><div class="stat"><div class="stat-val" style="color:#8A5200">${s.overdue}</div><div class="stat-label">Overdue</div></div></div>`;
  html2+=`<h2>Project Status</h2><table><tr><th>Project</th><th>Progress</th><th>Status</th><th>Due</th></tr>`;
  state.projects.forEach(p=>{const rag=ragStatus(p);const pp=pct(p.tasks);const label=rag==='green'?'On track':rag==='amber'?'At risk':'Off track';html2+=`<tr><td><strong>${p.name}</strong></td><td>${pp}%</td><td><span class="${rag}">${label}</span></td><td style="font-size:12px">${fdShort(p.due)}</td></tr>`;});html2+=`</table>`;
  if(dueSoon.length){html2+=`<h2>Due This Week (${dueSoon.length})</h2><table><tr><th>Task</th><th>Project</th><th>Owner</th><th>Due</th></tr>`;dueSoon.forEach(t=>{html2+=`<tr><td>${t.name}</td><td style="font-size:11px;color:#6B7280">${t.pName}</td><td>${t.owner}</td><td><strong>${fdShort(t.due)}</strong></td></tr>`;});html2+=`</table>`;}
  if(completedThisWeek.length){html2+=`<h2>Completed This Week 🎉 (${completedThisWeek.length})</h2><table><tr><th>Task</th><th>Project</th><th>Owner</th><th>Completed</th></tr>`;completedThisWeek.forEach(t=>{html2+=`<tr><td>${t.name}</td><td style="font-size:11px;color:#6B7280">${t.pName}</td><td>${t.owner}</td><td>${fdShort(t.actualDate)}</td></tr>`;});html2+=`</table>`;}
  if(blockedTasks.length){html2+=`<h2>Blocked 🔴</h2><table><tr><th>Task</th><th>Project</th><th>Owner</th></tr>`;blockedTasks.forEach(t=>{html2+=`<tr><td><strong>${t.name}</strong></td><td style="font-size:11px;color:#6B7280">${t.pName}</td><td>${t.owner}</td></tr>`;});html2+=`</table>`;}
  if(overdueTasks.length){html2+=`<h2>Overdue ⚠️</h2><table><tr><th>Task</th><th>Project</th><th>Was due</th></tr>`;overdueTasks.forEach(t=>{html2+=`<tr><td>${t.name}</td><td style="font-size:11px;color:#6B7280">${t.pName}</td><td style="color:#A81B1B"><strong>${fdShort(t.due)}</strong></td></tr>`;});html2+=`</table>`;}
  html2+=`<div style="margin-top:32px;padding-top:16px;border-top:1px solid #E5E7EB;font-size:11px;color:#9CA3AF;">Generated by FP&A Ninjas Tracker · Sogelink · ${now.toLocaleString('en-IE')}</div></body></html>`;
  const w=window.open('','_blank');
  if(w){w.document.open();w.document.write(html2);w.document.close();}
  else{showToast('Please allow popups to view the digest');}
}
