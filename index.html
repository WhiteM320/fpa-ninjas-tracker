<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FP&A Ninjas — Sogelink</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0A1628;--navy2:#142240;--blue:#1B5FA8;--blue2:#2472C8;--bluelt:#E8F1FB;
--bg:#F4F7FC;--surface:#FFFFFF;--border:#DDE4EF;--border2:#C2CDE0;
--text:#0A1628;--text2:#4A5878;--text3:#8A96AA;
--green:#0E6B4A;--greenbg:#E4F5EE;--red:#A81B1B;--redbg:#FAEAEA;
--amber:#8A5200;--amberbg:#FDF2DC;--purple:#4A2AB8;--purplebg:#EEEAF8;
--radius:10px;--rsm:6px;--font:'Segoe UI',system-ui,sans-serif;--mono:monospace;
--shadow:0 1px 4px rgba(10,22,40,0.08);--shadowmd:0 4px 16px rgba(10,22,40,0.1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
/* Topbar */
.topbar{background:var(--navy);padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100;}
.topbar-brand{font-size:13px;color:#fff;font-weight:500;}
.topbar-co{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:0.08em;text-transform:uppercase;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn-top{padding:5px 12px;border-radius:var(--rsm);font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.85);font-family:var(--font);}
.btn-top:hover{background:rgba(255,255,255,0.1);}
.topbar-user{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.7);}
.role-badge{font-size:10px;border-radius:99px;padding:2px 8px;font-family:var(--mono);}
.role-admin{background:var(--amberbg);color:var(--amber);}
.role-member{background:var(--bluelt);color:var(--blue);}
/* Page */
.page{padding:24px;max-width:1280px;margin:0 auto;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:20px;font-weight:300;letter-spacing:-0.02em;color:var(--navy);}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--rsm);font-family:var(--font);font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.12s;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue2);}
.btn-danger{color:var(--red);border-color:transparent;background:transparent;padding:3px 8px;font-size:12px;}
.btn-danger:hover{background:var(--redbg);}
.btn-sm{padding:3px 9px;font-size:12px;}
.btn-success{background:var(--green);color:#fff;border-color:var(--green);}
/* Avatar */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--mono);flex-shrink:0;}
/* Badges */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap;}
.s-ns{background:#EEF0F4;color:#4A5878;}.s-ip{background:var(--bluelt);color:var(--blue);}
.s-rv{background:var(--amberbg);color:var(--amber);}.s-co{background:var(--greenbg);color:var(--green);}
.s-bl{background:var(--redbg);color:var(--red);}
.prio-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;}
.p-h{background:#E24B4A;}.p-m{background:#EF9F27;}.p-l{background:var(--green);}
.due-ok{color:var(--text3);font-size:12px;}.due-soon{color:var(--amber);font-weight:500;font-size:12px;}.due-over{color:var(--red);font-weight:500;font-size:12px;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.tag-process{background:var(--purplebg);color:var(--purple);}.tag-reporting{background:var(--bluelt);color:var(--blue);}
.geo-badge{display:inline-flex;align-items:center;font-size:10px;padding:1px 7px;border-radius:99px;font-family:var(--mono);font-weight:500;}
.geo-FR{background:var(--redbg);color:var(--red);}.geo-NL{background:var(--amberbg);color:var(--amber);}
.geo-NO{background:var(--greenbg);color:var(--green);}.geo-Group{background:#EEF0F4;color:#4A5878;}.geo-all{background:#EEF0F4;color:#4A5878;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);}
.time-chip{font-family:var(--mono);font-size:11px;padding:2px 8px;background:var(--bluelt);color:var(--blue);border-radius:99px;}
.time-chip.over{background:var(--redbg);color:var(--red);}
/* Summary bar */
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:20px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);}
.sc-label{font-size:10px;color:var(--text2);margin-bottom:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em;}
.sc-val{font-size:24px;font-weight:300;letter-spacing:-0.03em;}
/* Tabs */
.main-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;}
.main-tab{font-size:13px;padding:9px 20px;cursor:pointer;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color 0.1s;}
.main-tab:hover{color:var(--text);}
.main-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:500;}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);}
.tab{font-size:12px;padding:7px 14px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab:hover{color:var(--text);}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input,.toolbar select,.sel,.search-input{font-family:var(--font);font-size:13px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface);color:var(--text);}
.toolbar input{flex:1;min-width:150px;}
/* Cards */
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);}
.proj-header{display:flex;align-items:center;gap:8px;padding:13px 18px;cursor:pointer;flex-wrap:wrap;}
.proj-header:hover{background:var(--bg);}
.proj-name{font-size:14px;font-weight:500;flex:1;min-width:120px;}
.chevron{font-size:10px;color:var(--text3);transition:transform 0.15s;display:inline-block;}
.chevron.open{transform:rotate(90deg);}
.prog-wrap{width:60px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-bar{height:100%;background:var(--blue2);border-radius:99px;transition:width 0.3s;}
.prog-bar.done{background:var(--green);}
.proj-body{padding:14px 18px;}
.proj-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.add-proj-row{padding:10px 0;}
/* Tables */
.task-table-wrap{overflow-x:auto;}
.task-table{width:100%;border-collapse:collapse;font-size:13px;}
.task-table th{text-align:left;padding:6px 10px;font-size:10px;font-weight:500;color:var(--text2);background:var(--bg);border-bottom:1px solid var(--border);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.task-table td{padding:8px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle;}
.task-table tr:hover td{background:#F8FAFD;}
.mini-sel{font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--rsm);background:transparent;color:var(--text);font-family:var(--font);width:100%;}
.add-inp{font-family:var(--font);font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface);color:var(--text);}
.add-inp-sm{font-family:var(--font);font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface);color:var(--text);width:120px;}
.add-sel{font-family:var(--font);font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface);color:var(--text);}
.add-row-inner{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0;}
.date-inp{font-family:var(--font);font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--rsm);background:transparent;color:var(--text);width:130px;}
.num-inp{width:55px;font-family:var(--mono);font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:var(--rsm);background:transparent;color:var(--text);text-align:right;}
.date-history{font-size:10px;color:var(--text3);margin-top:2px;}
.date-original{text-decoration:line-through;color:var(--red);}
/* Phase + Meeting */
.phase-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-family:var(--mono);white-space:nowrap;font-weight:500;}
.phase-setup{background:#EEF0F4;color:#2A3858;}.phase-bookings{background:var(--bluelt);color:var(--blue);}
.phase-reviews{background:var(--amberbg);color:var(--amber);}.phase-exec{background:var(--redbg);color:var(--red);}
.phase-finalise{background:var(--greenbg);color:var(--green);}
.meeting-cell{display:flex;flex-direction:column;gap:2px;}
.meeting-status{display:flex;align-items:center;gap:4px;font-size:11px;}
.meeting-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.m-needed{background:#EF9F27;}.m-setup{background:#1D9E75;}
.meeting-owner{font-size:10px;color:var(--text3);font-family:var(--mono);}
.meeting-comment{font-size:10px;color:var(--text2);font-style:italic;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rel-day{font-family:var(--mono);font-size:11px;color:var(--text3);}
/* Cadence */
.cadence-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-family:var(--mono);}
.cadence-q{background:var(--bluelt);color:var(--blue);}.cadence-m{background:var(--greenbg);color:var(--green);}.cadence-o{background:#EEF0F4;color:var(--text2);}
/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px;}
.dash-full{grid-column:1/-1;}
.dash-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.dash-section h3{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:12px;}
.rag-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.rag-row:last-child{border-bottom:none;}
.rag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.rag-green{background:var(--green);}.rag-amber{background:#EF9F27;}.rag-red{background:var(--red);}
.rag-name{flex:1;font-weight:500;}.rag-meta{font-size:11px;color:var(--text3);}
.due-item,.blocked-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.due-item:last-child,.blocked-item:last-child{border-bottom:none;}
.due-item-name{flex:1;}.due-item-proj{font-size:11px;color:var(--text3);}
.dash-stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;}
.dash-stat{text-align:center;padding:10px 6px;background:var(--bg);border-radius:var(--rsm);}
.dash-stat-val{font-size:22px;font-weight:300;letter-spacing:-0.03em;}
.dash-stat-label{font-size:10px;color:var(--text3);margin-top:2px;}
/* Workspace */
.workspace-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;}
.workspace-tab{font-size:13px;padding:8px 16px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.workspace-tab:hover{color:var(--text);}.workspace-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.mt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid var(--border);}
.mt-card:hover{border-left-color:var(--blue2);}
.mt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.mt-name{font-size:13px;font-weight:500;flex:1;}
.mt-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.mt-actions{display:flex;gap:5px;flex-wrap:wrap;}
.section-head{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:8px;margin-top:20px;padding-bottom:5px;border-bottom:1px solid var(--border);}
/* Member project/wf cards */
.member-proj-card,.member-wf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow);}
.member-wf-card{border-left:3px solid var(--blue2);}
.member-proj-header,.member-wf-header{display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap;}
.member-proj-name,.member-wf-name{font-size:13px;font-weight:500;flex:1;}
.member-proj-body,.member-wf-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
/* Login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;width:360px;max-width:100%;box-shadow:var(--shadowmd);}
.login-title{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--navy);}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:5px;}
.field select,.field input{width:100%;font-family:var(--font);font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text);}
.field select:focus,.field input:focus{outline:none;border-color:var(--blue);}
.login-actions{display:flex;gap:8px;margin-top:4px;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;width:420px;max-width:100%;box-shadow:var(--shadowmd);}
.modal-box h3{font-size:14px;font-weight:500;color:var(--navy);margin-bottom:14px;}
.modal-field{margin-bottom:12px;}
.modal-field label{display:block;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em;color:var(--text2);margin-bottom:4px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;font-family:var(--font);font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text);}
.modal-field input:focus,.modal-field select:focus{outline:none;border-color:var(--blue);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
/* Thread */
.task-thread-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.task-thread-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:500px;max-width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadowmd);}
.task-thread-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);}
.task-thread-title{font-size:14px;font-weight:500;color:var(--navy);}
.task-thread-body{flex:1;overflow-y:auto;padding:14px 20px;}
.tn-comment{display:flex;gap:8px;margin-bottom:12px;}
.tn-comment-body{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 12px;}
.tn-comment-author{font-size:12px;font-weight:500;}
.tn-comment-ts{font-size:10px;color:var(--text3);font-family:var(--mono);}
.tn-comment-text{font-size:13px;line-height:1.5;margin-top:4px;white-space:pre-wrap;}
.tn-mention{background:var(--bluelt);color:var(--blue);border-radius:3px;padding:0 3px;font-weight:500;}
.tn-empty{text-align:center;padding:20px;color:var(--text3);font-size:13px;}
.task-thread-input{padding:12px 20px 16px;border-top:1px solid var(--border);}
.thread-textarea{width:100%;font-family:var(--font);font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text);resize:none;min-height:70px;}
.thread-textarea:focus{outline:none;border-color:var(--blue);}
.thread-hint{font-size:11px;color:var(--text3);}
.mention-dropdown{position:absolute;bottom:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);box-shadow:var(--shadowmd);z-index:500;min-width:160px;max-height:140px;overflow-y:auto;}
.mention-item{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12px;cursor:pointer;}
.mention-item:hover{background:var(--bg);}
.thread-textarea-wrap{position:relative;}
/* Subtasks */
.subtask-wrap{padding:8px 12px;border-left:2px solid var(--bluelt);margin-left:12px;}
.subtask-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;}
.subtask-check{width:13px;height:13px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;}
.subtask-name{flex:1;}.subtask-name.done{text-decoration:line-through;color:var(--text3);}
.subtask-add-row{display:flex;gap:5px;padding:5px 0;align-items:center;flex-wrap:wrap;}
.notes-panel{padding:8px 12px;background:var(--bg);border-top:0.5px solid var(--border);}
.notes-panel label{font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--text2);display:block;margin-bottom:4px;}
.notes-panel textarea{width:100%;font-family:var(--font);font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface);color:var(--text);resize:vertical;min-height:60px;}
.task-expand-btn{font-size:10px;color:var(--text3);cursor:pointer;padding:1px 4px;border:none;background:transparent;}
/* Gantt/Timeline */
.wf-timeline-wrap{padding:16px;}
.wf-timeline-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.wf-timeline-title{font-size:16px;font-weight:300;color:var(--navy);}
.wf-timeline-sub{font-size:12px;color:var(--text2);}
.wf-phase-group{margin-bottom:20px;}
.wf-phase-label{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.wf-timeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.wf-tl-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 12px;border-left:3px solid var(--border);}
.wf-tl-card.phase-setup{border-left-color:#4A5878;}.wf-tl-card.phase-bookings{border-left-color:var(--blue2);}
.wf-tl-card.phase-reviews{border-left-color:#EF9F27;}.wf-tl-card.phase-exec{border-left-color:var(--red);}
.wf-tl-card.phase-finalise{border-left-color:var(--green);}
.wf-tl-card-name{font-size:12px;font-weight:500;color:var(--navy);margin-bottom:4px;line-height:1.4;}
.wf-tl-card-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.print-btn{background:var(--navy);color:#fff;border:none;border-radius:var(--rsm);padding:6px 12px;font-size:12px;cursor:pointer;}
/* Stk view */
.stk-view-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.stk-view-section h3{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:10px;}
.stk-dep-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.stk-dep-item:last-child{border-bottom:none;}
.stk-dep-name{flex:1;font-weight:500;}
/* Import/export */
.import-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
.import-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:420px;max-width:100%;box-shadow:var(--shadowmd);}
.import-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;}
.import-drop:hover,.import-drop.dragover{border-color:var(--blue);background:var(--bluelt);}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--rsm);font-size:13px;z-index:999;box-shadow:var(--shadowmd);animation:toastIn 0.2s ease;}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Date reason */
.date-reason-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.4);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.date-reason-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;width:400px;max-width:100%;box-shadow:var(--shadowmd);}
/* Sync */
#sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.45);font-family:monospace;}
/* History */
.history-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);flex-wrap:wrap;}
.hs-ok{color:var(--green);font-weight:500;}.hs-partial{color:var(--amber);font-weight:500;}.hs-late{color:var(--red);font-weight:500;}
.hist-stat{font-size:12px;}
/* Empty */
.empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;}
/* Translated */
.translate-btn{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--bluelt);background:var(--bluelt);color:var(--blue);cursor:pointer;margin-left:4px;}
.translated-label{font-size:9px;background:var(--blue);color:#fff;border-radius:3px;padding:1px 4px;font-family:var(--mono);}
/* Print */
@media print{.topbar,.main-tabs,.toolbar,.btn,.tabs{display:none!important;}.print-btn{display:none!important;}}
</style>

}

  document.getElementById("app").innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);flex-direction:column;gap:12px"><div style="color:#fff;font-size:16px;font-weight:300">Loading FP&A Ninjas...</div></div>';
  try{
    const r=await fetch(CF_URL,{method:"GET",headers:{"X-API-Key":CF_KEY},mode:"cors"});
    if(r.ok){const t=await r.text();state=t&&t!=="null"?JSON.parse(t):null;}
    else throw new Error(r.status);
  }catch(e){
    console.warn("Cloud load failed:",e);
    const s=localStorage.getItem("sogelink_fpa_live");
    state=s?JSON.parse(s):null;
  }
  if(!state)state=JSON.parse(JSON.stringify(DEF));
  // Defaults
  if(!state.workflows)state.workflows=[];
  if(!state.activeTab)state.activeTab={};
  if(!state.mainTab)state.mainTab="dashboard";
  if(!state.teamMembers||!state.teamMembers.length)state.teamMembers=[ADMIN,"Louis","Rayane","Alex","Antoine","Martin","Laure-Helene","Philippe","Christelle","Aisha","Thomas"];
  // Always replace LE workflow entirely from DEF (ensures latest tasks/data)
  const defLe=(DEF.workflows||[]).find(w=>w.name&&w.name.includes("Latest Estimate"));
  const leIdx=(state.workflows||[]).findIndex(w=>w.name&&w.name.includes("Latest Estimate"));
  if(defLe){
    const fresh=JSON.parse(JSON.stringify(defLe));
    if(leIdx>=0){
      // Preserve task statuses, logged hours and notes from saved data
      const savedCycle=state.workflows[leIdx].cycles&&state.workflows[leIdx].cycles[0];
      const savedHistory=state.workflows[leIdx].history||[];
      if(savedCycle&&fresh.cycles&&fresh.cycles[0]){
        fresh.cycles[0].tasks.forEach(ft=>{
          const saved=savedCycle.tasks&&savedCycle.tasks.find(st=>st.name===ft.name);
          if(saved){
            ft.status=saved.status||ft.status;
            ft.actualDate=saved.actualDate||ft.actualDate;
            ft.loggedHrs=saved.loggedHrs||ft.loggedHrs;
            ft.taskNotes=saved.taskNotes||ft.taskNotes;
            ft.subtasks=saved.subtasks||ft.subtasks;
            // Keep meetingSetup if user already toggled it
            if(saved.meetingSetup) ft.meetingSetup=true;
          }
        });
      }
      fresh.history=savedHistory;
      state.workflows[leIdx]=fresh;
    } else {
      if(!state.workflows)state.workflows=[];
      state.workflows.push(fresh);
    }
  }
  state.defVersion=DEF.defVersion||8;
  // Merge new DEF projects
  const sIds=new Set(state.projects.map(p=>p.id));
  JSON.parse(JSON.stringify(DEF)).projects.filter(p=>!sIds.has(p.id)).forEach(p=>state.projects.push(p));
  const wIds=new Set((state.workflows||[]).map(w=>w.id));
  JSON.parse(JSON.stringify(DEF.workflows||[])).filter(w=>!wIds.has(w.id)).forEach(w=>state.workflows.push(w));
  // Fill defaults
  state.projects.forEach(p=>{
    if(!p.comments)p.comments=[];if(p.estEnabled===undefined)p.estEnabled=true;
    p.tasks.forEach(t=>{if(!t.geo)t.geo="Group";if(!t.originalDue)t.originalDue=t.due||"";if(!t.dueHistory)t.dueHistory=[];if(t.actualDate===undefined)t.actualDate="";if(!t.subtasks)t.subtasks=[];if(!t.taskNotes)t.taskNotes=[];});
  });
  state.workflows.forEach(w=>{
    if(!w.template)w.template=[];if(!w.cycles)w.cycles=[];if(!w.history)w.history=[];
    w.template.forEach(t=>{if(!t.geo)t.geo="Group";if(!t.phase)t.phase="";if(!t.stakeholders)t.stakeholders="";if(!t.meetingNeeded)t.meetingNeeded=false;if(!t.meetingSetup)t.meetingSetup=false;if(!t.meetingComment)t.meetingComment="";if(!t.meetingOwner)t.meetingOwner="";});
    w.cycles.forEach(c=>{(c.tasks||[]).forEach(t=>{if(!t.geo)t.geo="Group";if(!t.subtasks)t.subtasks=[];if(!t.taskNotes)t.taskNotes=[];if(!t.phase)t.phase="";if(!t.stakeholders)t.stakeholders="";if(!t.meetingNeeded)t.meetingNeeded=false;if(!t.meetingSetup)t.meetingSetup=false;if(!t.meetingComment)t.meetingComment="";if(!t.meetingOwner)t.meetingOwner="";});});
  });
  // Auto-login
  try{const r=localStorage.getItem("fpa_remembered_user");if(r){const d=JSON.parse(r);if(d.name&&(Date.now()-d.ts)<30*24*60*60*1000)currentUser={name:d.name,role:d.name===ADMIN?"admin":"member"};}}catch(e){}
}

// ── Gantt ─────────────────────────────────────────────────────────────────────
function renderGantt(p){
  const tasks=p.tasks.filter(t=>t.due);if(!tasks.length)return`<div class="empty">No tasks with dates.</div>`;
  const dates=tasks.map(t=>new Date(t.due+"T00:00:00"));
  const minD=new Date(Math.min(...dates));const maxD=new Date(Math.max(...dates));
  minD.setDate(minD.getDate()-2);maxD.setDate(maxD.getDate()+3);
  const totalMs=maxD-minD;
  const months=[];let cur=new Date(minD);
  while(cur<=maxD){const l=cur.toLocaleDateString("en-IE",{month:"short",year:"2-digit"});if(!months.length||months[months.length-1].l!==l)months.push({l,pct:Math.round((cur-minD)/totalMs*100)});cur.setDate(cur.getDate()+1);}
  const bars=tasks.map(t=>{
    const d=new Date(t.due+"T00:00:00");const sd=new Date(d);sd.setDate(sd.getDate()-3);
    const sp=Math.max(0,Math.round((sd-minD)/totalMs*100));const ep=Math.min(100,Math.round((d-minD)/totalMs*100));
    const w=Math.max(1,ep-sp);
    const color=t.status==="Complete"?"var(--green)":t.status==="Blocked"?"var(--red)":t.status==="In progress"?"var(--blue2)":"var(--bluelt)";
    const tc=["Complete","Blocked","In progress"].includes(t.status)?"#fff":"var(--navy)";
    return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:12px">
      <div style="width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</div>
      <div style="flex:1;position:relative;height:22px">
        <div style="position:absolute;left:${sp}%;width:${w}%;height:100%;background:${color};border-radius:3px;display:flex;align-items:center;padding:0 5px;overflow:hidden">
          <span style="font-size:10px;color:${tc};white-space:nowrap">${fdShort(t.due)}</span>
        </div>
      </div>
    </div>`;
  }).join("");
  const monthHeaders=months.map(m=>`<div style="position:absolute;left:${m.pct}%;font-size:10px;color:var(--text3);white-space:nowrap;font-family:var(--mono)">${m.l}</div>`).join("");
  return`<div style="padding:10px 0"><div style="position:relative;height:18px;margin-left:168px;margin-bottom:6px">${monthHeaders}</div>${bars}</div>`;
}

// ── Time log ──────────────────────────────────────────────────────────────────
function renderTimeLog(p){
  const tasks=p.tasks.filter(t=>(t.estHrs||0)>0||(t.loggedHrs||0)>0);
  if(!tasks.length)return`<div class="empty">No time estimates logged yet.</div>`;
  const te=tasks.reduce((a,t)=>a+(t.estHrs||0),0),tl=tasks.reduce((a,t)=>a+(t.loggedHrs||0),0);
  const rows=tasks.map(t=>{const pctD=t.estHrs?Math.min(100,Math.round((t.loggedHrs||0)/t.estHrs*100)):0;const ov=(t.loggedHrs||0)>(t.estHrs||0);
    return`<tr><td style="font-size:13px">${t.name}</td><td style="text-align:center">${fh(t.estHrs||0)}</td><td style="text-align:center"><span class="time-chip ${ov?"over":""}">${fh(t.loggedHrs||0)}</span></td>
    <td><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden"><div style="width:${pctD}%;height:100%;background:${ov?"var(--red)":"var(--green)"};border-radius:99px"></div></div><span style="font-size:11px;color:var(--text3)">${pctD}%</span></div></td>
    <td style="text-align:right"><button class="btn btn-sm" onclick="openLog(${p.id},${t.id})">Log</button></td></tr>`;
  }).join("");
  return`<div style="padding:8px 0">
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div class="sc"><div class="sc-label">Est total</div><div class="sc-val">${fh(te)}</div></div>
      <div class="sc"><div class="sc-label">Logged</div><div class="sc-val">${fh(tl)}</div></div>
      <div class="sc"><div class="sc-label">Remaining</div><div class="sc-val" style="color:${tl>te?"var(--red)":"var(--green)"}">${fh(Math.max(0,te-tl))}</div></div>
    </div>
    <table class="task-table"><thead><tr><th>Task</th><th style="text-align:center">Est</th><th style="text-align:center">Logged</th><th>Progress</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

function renderWorkflowGantt(w,ac){

  while(cur<=maxD){const l=cur.toLocaleDateString("en-IE",{month:"short",year:"2-digit"});if(!months.length||months[months.length-1].l!==l)months.push({l,pct:Math.round((cur-minD)/totalMs*100)});cur.setDate(cur.getDate()+1);}
  const phColors={"Setup / Kickoff":"#4A5878","Bookings & Inputs":"var(--blue2)","Reviews":"#EF9F27","Exec Reviews":"var(--red)","Finalise & Board":"var(--green)"};

  const bars=sorted.map(t=>{
    const d=new Date(t.due+"T00:00:00");const sd=new Date(d);sd.setDate(sd.getDate()-3);

function renderStakeholderView(){
  const map={};
  state.projects.forEach(p=>{(p.stakeholders||[]).forEach(s=>{if(!map[s.name])map[s.name]=[];map[s.name].push({type:"Project",name:p.name,role:s.role});});p.tasks.forEach(t=>{(t.stakeholders||"").split(",").filter(Boolean).forEach(g=>{const k=g.trim();if(!map[k])map[k]=[];map[k].push({type:"Task",name:t.name,project:p.name,role:"Task stakeholder"});});});});
  (state.workflows||[]).forEach(w=>{const ac=activeCycle(w);if(ac)(ac.tasks||[]).forEach(t=>{(t.stakeholders||"").split(",").filter(Boolean).forEach(g=>{const k=g.trim();if(!map[k])map[k]=[];map[k].push({type:"Workflow",name:t.name,project:w.name,role:t.phase||"Workflow task"});});});});
  if(!Object.keys(map).length)return`<div class="empty">No stakeholders recorded yet. Add stakeholder names to tasks and projects.</div>`;
  return Object.entries(map).sort((a,b)=>b[1].length-a[1].length).map(([stk,deps])=>`<div class="stk-view-section"><h3>${av(stk,24)} ${stk} <span style="font-size:11px;font-weight:400;color:var(--text3)">${deps.length} involvement${deps.length>1?"s":""}</span></h3>${deps.map(d=>`<div class="stk-dep-item"><span class="badge ${d.type==="Project"?"s-ip":d.type==="Workflow"?"s-rv":"s-ns"}" style="font-size:10px">${d.type}</span><div><div class="stk-dep-name">${d.name}</div><div style="font-size:11px;color:var(--text3)">${d.project||""}</div></div><span style="font-size:11px;color:var(--text2)">${d.role}</span></div>`).join("")}</div>`).join("");
}

// ── Member view ───────────────────────────────────────────────────────────────
function myTasks(){
  const projT=state.projects.flatMap(p=>p.tasks.filter(t=>taskVisibleTo(t,currentUser.name)).map(t=>({...t,pid:p.id,pName:p.name,isWf:false})));
  const wfT=(state.workflows||[]).flatMap(w=>{const ac=activeCycle(w);if(!ac)return[];return(ac.tasks||[]).filter(t=>t.owner===currentUser.name).map(t=>({...t,wfId:w.id,wfName:w.name,isWf:true}));});
  return[...projT,...wfT];
}
function mCard(t){
  const isWf=t.isWf;
  const subPct=(t.subtasks||[]).length?Math.round((t.subtasks||[]).filter(x=>x.done).length/(t.subtasks||[]).length*100):0;
  const onchangeStr=isWf?"updCycleStatus("+t.wfId+","+t.id+",this.value)":"updStatus("+t.pid+","+t.id+",this.value)";
  const completeStr=isWf?"updCycleStatus("+t.wfId+","+t.id+",'Complete')"  :"updStatus("+t.pid+","+t.id+",'Complete')";
  return`<div class="mt-card">
    <div class="mt-header"><div class="mt-name">${t.name}</div><span class="badge ${scls(t.status)}">${t.status}</span></div>
    <div class="mt-meta"><span class="${dc(t.due,t.status)}">${t.due?fdShort(t.due):"No date"}</span>${isWf?`<span class="tag" style="font-size:11px">${t.wfName||""}</span>`:`<span style="font-size:11px;color:var(--text3)">${t.pName||""}</span>`}${geoBadge(t.geo)}</div>
    ${(t.subtasks||[]).length?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><div style="flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden"><div style="width:${subPct}%;height:100%;background:var(--blue2);border-radius:99px"></div></div><span style="font-size:11px;color:var(--text3)">${(t.subtasks||[]).filter(x=>x.done).length}/${(t.subtasks||[]).length}</span></div>`:""}
    <div class="mt-actions">
      <select class="mini-sel" style="width:auto" onchange="${onchangeStr}">${["Not started","In progress","Review","Complete","Blocked"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select>
      ${!isWf?`<button class="btn btn-sm" onclick="openLog(${t.pid||0},${t.id})">Log time</button>`:""}
      <button class="btn btn-sm btn-success" onclick="${completeStr}" ${t.status==="Complete"?"disabled style='opacity:0.5'":""}>✓ Complete</button>
      ${!isWf?`<button class="btn btn-sm" onclick="openTaskThread(${t.pid||0},${t.id},'${(t.name||"").replace(/'/g,"&apos;")}')" style="${(t.taskNotes||[]).length?"color:var(--blue);border-color:var(--bluelt)":""}">📝${(t.taskNotes||[]).length?" ("+t.taskNotes.length+")":""}</button>`:""}
    </div>
  </div>`;
}
function renderMemberProjects(){
  return state.projects.map(p=>{

    </tbody></table></div>`:""}

  }).join("");

function renderMemberWorkflows(){
  return(state.workflows||[]).map(w=>{
    const ac=activeCycle(w);const pp=ac?cyclePct(ac):0;
    const exp=state.memberExpandedWfs&&state.memberExpandedWfs[w.id];
    const tasks=ac?ac.tasks:[];const mine=tasks.filter(t=>t.owner===currentUser.name);
    const needsMtg=tasks.filter(t=>t.meetingNeeded&&!t.meetingSetup).length;

    return`<div class="member-wf-card"><div class="member-wf-header" onclick="if(!state.memberExpandedWfs)state.memberExpandedWfs={};state.memberExpandedWfs[${w.id}]=!state.memberExpandedWfs[${w.id}];renderMember()">
      <span class="chevron ${exp?"open":""}">&#9654;</span><span class="member-wf-name">${w.name}</span>
      <span class="cadence-badge ${cadenceBadge(w.cadence)}">${cadenceLabel(w.cadence)}</span>
      ${ac?`<span style="font-size:12px;color:var(--text2)">${ac.label}</span><div class="prog-wrap" style="width:60px"><div class="prog-bar" style="width:${pp}%"></div></div><span style="font-size:12px;color:var(--text2)">${pp}%</span>`:`<span style="font-size:12px;color:var(--text3)">No active cycle</span>`}
      ${mine.length?`<span class="badge s-ip" style="font-size:11px">${mine.length} mine</span>`:""}
      ${needsMtg?`<span class="badge s-rv" style="font-size:11px">⚠ ${needsMtg} meetings</span>`:""}
    </div>
    ${exp&&ac?`<div class="member-wf-body">${[...phases,"Other"].filter(ph=>(grouped[ph]||[]).length>0).map(ph=>`
      <div style="margin-bottom:12px"><div style="margin-bottom:5px">${phaseBadge(ph)}</div>
      <table class="task-table"><thead><tr><th>Task</th><th>Due</th><th>Status</th><th>Meeting</th><th>Stakeholders</th></tr></thead><tbody>
      ${(grouped[ph]||[]).map(t=>`<tr style="${t.owner===currentUser.name?"background:rgba(27,95,168,0.04)":""}"><td>${t.name}${t.owner===currentUser.name?`<span style="font-size:10px;background:var(--blue);color:#fff;border-radius:99px;padding:1px 5px;margin-left:4px">Mine</span>`:""}</td><td><span class="${dc(t.due,t.status)}">${fdShort(t.due)}</span></td><td><select class="mini-sel" style="font-size:11px" onchange="updCycleStatus(${w.id},${t.id},this.value)">${["Not started","In progress","Review","Complete","Blocked"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td>${meetingCell(t)}</td><td style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px">${t.stakeholders||"—"}</td></tr>`).join("")}
      </tbody></table></div>`).join("")}</div>`:""}
    </div>`;
  }).join("");
}

    <div class="summary-bar">

// ── Project/task CRUD ─────────────────────────────────────────────────────────
function openAddProj(){showModal(`<h3>New project</h3><div class="modal-field"><label>Name</label><input id="ap_n" placeholder="Project name..." /></div><div class="modal-field"><label>Type</label><select id="ap_t"><option>Reporting</option><option>Process improvement</option></select></div><div class="modal-field"><label>Target date</label><input type="date" id="ap_d" /></div><div class="modal-field"><label>Owner</label><input id="ap_o" value="${currentUser.name}" /></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAddProj()">Create</button></div>`);}
function saveAddProj(){const n=document.getElementById("ap_n").value.trim();if(!n){showToast("Please enter a name");return;}const mx=state.projects.reduce((m,p)=>Math.max(m,p.id),0);state.projects.push({id:mx+1,name:n,type:document.getElementById("ap_t").value,owner:document.getElementById("ap_o").value||currentUser.name,due:document.getElementById("ap_d").value||"",geo:"Group",tasks:[],comments:[],stakeholders:[],estEnabled:true});save();closeModal();renderAdmin();showToast("Project created: "+n);}
function openEditProj(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;showModal(`<h3>Edit project</h3><div class="modal-field"><label>Name</label><input id="ep_n" value="${p.name.replace(/"/g,"&quot;")}" /></div><div class="modal-field"><label>Type</label><select id="ep_t"><option ${p.type==="Reporting"?"selected":""}>Reporting</option><option ${p.type==="Process improvement"?"selected":""}>Process improvement</option></select></div><div class="modal-field"><label>Target date</label><input type="date" id="ep_d" value="${p.due||""}" /></div><div class="modal-field"><label>Owner</label><input id="ep_o" value="${p.owner||""}" /></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditProj(${pid})">Save</button></div>`);}
function saveEditProj(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;p.name=document.getElementById("ep_n").value.trim()||p.name;p.type=document.getElementById("ep_t").value;p.due=document.getElementById("ep_d").value||p.due;p.owner=document.getElementById("ep_o").value||p.owner;save();closeModal();renderAdmin();showToast("Project updated");}
function delProj(pid){if(!isAdmin())return;state.projects=state.projects.filter(p=>p.id!==pid);save();renderAdmin();showToast("Project deleted");}
function addTask(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;const n=(document.getElementById("nt_n_"+pid)||{}).value?.trim();if(!n)return;const mx=p.tasks.reduce((m,t)=>Math.max(m,t.id),0);p.tasks.push({id:mx+1,name:n,owner:(document.getElementById("nt_o_"+pid)||{}).value||currentUser.name,due:(document.getElementById("nt_d_"+pid)||{}).value||"",originalDue:"",dueHistory:[],priority:(document.getElementById("nt_p_"+pid)||{}).value||"Medium",status:"Not started",geo:(document.getElementById("nt_g_"+pid)||{}).value||"Group",estHrs:0,loggedHrs:0,actualDate:"",notes:"",subtasks:[],taskNotes:[]});document.getElementById("nt_n_"+pid).value="";save();renderAdmin();}
function delTask(pid,tid){if(!isAdmin())return;const p=state.projects.find(x=>x.id===pid);if(!p)return;p.tasks=p.tasks.filter(t=>t.id!==tid);save();renderAdmin();showToast("Task deleted");}
function updStatus(pid,tid,val){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;const prev=t.status;t.status=val;if(val==="Complete"&&prev!=="Complete"){if(!t.actualDate)t.actualDate=new Date().toISOString().slice(0,10);showCelebration(t.name);}save();renderAdmin();}
function updPrio(pid,tid,val){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;t.priority=val;save();}
function updEst(pid,tid,val){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;t.estHrs=parseFloat(val)||0;save();}
function setActualDate(pid,tid,val){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;t.actualDate=val;save();renderAdmin();}
function openAssignTask(pid,tid){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;showModal(`<h3>Assign task</h3><div style="font-size:13px;color:var(--text2);margin-bottom:12px">${t.name}</div><div class="modal-field"><label>Assign to</label><select id="assign_o">${getTeamMembers().map(m=>`<option ${m===t.owner?"selected":""}>${m}</option>`).join("")}</select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAssign(${pid},${tid})">Assign</button></div>`);}
function saveAssign(pid,tid){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;t.owner=document.getElementById("assign_o").value;save();closeModal();renderAdmin();showToast(t.name+" assigned to "+t.owner);}
function openLog(pid,tid){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;showModal(`<h3>Log time</h3><div style="font-size:13px;color:var(--text2);margin-bottom:12px"><strong>${t.name}</strong><br>Logged: ${fh(t.loggedHrs||0)} of ${fh(t.estHrs||0)}</div><div class="modal-field"><label>Hours to add</label><input type="number" id="log_h" min="0" step="0.5" placeholder="e.g. 2.5" /></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveLog(${pid},${tid})">Log</button></div>`);}

function openAddStakeholder(pid){showModal(`<h3>Add stakeholder</h3><div class="modal-field"><label>Name</label><input id="stk_n" placeholder="e.g. CFO, Finance Controller" /></div><div class="modal-field"><label>Role</label><select id="stk_r"><option>Accountable</option><option selected>Responsible</option><option>Consulted</option><option>Informed</option></select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStakeholder(${pid})">Add</button></div>`);}
function saveStakeholder(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;const n=document.getElementById("stk_n").value.trim();if(!n)return;if(!p.stakeholders)p.stakeholders=[];const mx=p.stakeholders.reduce((m,s)=>Math.max(m,s.id||0),0);p.stakeholders.push({id:mx+1,name:n,role:document.getElementById("stk_r").value});save();closeModal();renderAdmin();showToast(n+" added");}

// ── Date change ───────────────────────────────────────────────────────────────
function updateTargetDate(pid,tid,newDue){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t||t.due===newDue)return;if(!t.due){t.due=newDue;save();return;}if(newDue>t.due){_pendingDate={pid,tid,newDue,oldDue:t.due};showDateModal(t.name,t.due,newDue);}else{applyDate(pid,tid,newDue,"Date moved earlier");}}
function showDateModal(name,oldD,newD){const ov=document.createElement("div");ov.className="date-reason-overlay";ov.id="date-reason-ov";ov.innerHTML=`<div class="date-reason-modal"><h3 style="font-size:14px;font-weight:500;color:var(--navy);margin-bottom:6px">Why is this date moving?</h3><p style="font-size:13px;color:var(--text2);margin-bottom:14px">Moving <strong>${name}</strong> from <strong>${fdShort(oldD)}</strong> to <strong>${fdShort(newD)}</strong>.</p><input id="date-reason-inp" style="width:100%;font-family:var(--font);font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text)" placeholder="Reason for delay..." /><div class="date-reason-actions"><button class="btn" onclick="cancelDate()">Cancel</button><button class="btn btn-primary" onclick="confirmDate()">Confirm</button></div></div>`;ov.onclick=e=>{if(e.target===ov)cancelDate();};document.body.appendChild(ov);setTimeout(()=>document.getElementById("date-reason-inp")?.focus(),50);}
function cancelDate(){document.getElementById("date-reason-ov")?.remove();_pendingDate=null;renderAdmin();}
function confirmDate(){const el=document.getElementById("date-reason-inp");const r=el?el.value.trim():"";if(!r){if(el){el.style.borderColor="var(--red)";el.placeholder="Please enter a reason...";}return;}document.getElementById("date-reason-ov")?.remove();if(_pendingDate){applyDate(_pendingDate.pid,_pendingDate.tid,_pendingDate.newDue,r);_pendingDate=null;}}
function applyDate(pid,tid,newDue,reason){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;const now=new Date();const ts=now.toLocaleDateString("en-IE",{day:"numeric",month:"short"})+", "+now.toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit"});if(!t.dueHistory)t.dueHistory=[];t.dueHistory.push({from:t.due,to:newDue,by:currentUser.name,ts,reason});t.due=newDue;save();renderAdmin();}

// ── Workflow CRUD ─────────────────────────────────────────────────────────────
function openAddWorkflow(){showModal(`<h3>New workflow</h3><div class="modal-field"><label>Name</label><input id="wf_n" placeholder="e.g. Latest Estimate (LE) Cycle" /></div><div class="modal-field"><label>Cadence</label><select id="wf_c"><option value="quarterly">Quarterly</option><option value="monthly">Monthly</option><option value="custom">Custom</option></select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAddWorkflow()">Create</button></div>`);}
function saveAddWorkflow(){const n=document.getElementById("wf_n").value.trim();if(!n)return;const mx=(state.workflows||[]).reduce((m,w)=>Math.max(m,w.id),0);if(!state.workflows)state.workflows=[];state.workflows.push({id:mx+1,name:n,cadence:document.getElementById("wf_c").value,template:[],cycles:[],history:[]});save();closeModal();renderAdmin();showToast("Workflow created");}
function deleteWf(wid){if(!isAdmin())return;state.workflows=(state.workflows||[]).filter(w=>w.id!==wid);save();renderAdmin();showToast("Workflow deleted");}
function openStartCycle(wid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;showModal(`<h3>Start new cycle</h3><div class="modal-field"><label>Cycle label</label><input id="sc_l" value="${w.name.includes("LE")?"LE3 — FY2026":"New cycle"}" /></div><div class="modal-field"><label>Anchor date (BOD / key submission)</label><input type="date" id="sc_a" /></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStartCycle(${wid})">Start cycle</button></div>`);}
function saveStartCycle(wid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const label=document.getElementById("sc_l").value.trim();const anchor=document.getElementById("sc_a").value;if(!label||!anchor){showToast("Please fill all fields");return;}const anchorD=new Date(anchor+"T00:00:00");const cid=Date.now();const tasks=(w.template||[]).map((t,i)=>{const dd=new Date(anchorD);dd.setDate(dd.getDate()+(t.relDay||0));while(dd.getDay()===0||dd.getDay()===6)dd.setDate(dd.getDate()+1);return{...JSON.parse(JSON.stringify(t)),id:cid+i,due:dd.toISOString().slice(0,10),originalDue:dd.toISOString().slice(0,10),dueHistory:[],status:"Not started",actualDate:"",loggedHrs:0,subtasks:[],taskNotes:[]};});if(w.cycles&&w.cycles.length){w.cycles[0].closed=new Date().toISOString().slice(0,10);if(!w.history)w.history=[];w.history.unshift(w.cycles[0]);}w.cycles=[{id:cid,anchor,start:new Date().toISOString().slice(0,10),label,tasks}];save();closeModal();renderAdmin();showToast("Cycle started: "+label);}
function closeCycle(wid){const w=state.workflows.find(x=>x.id===wid);if(!w||!w.cycles||!w.cycles.length)return;const ac=w.cycles[0];ac.closed=new Date().toISOString().slice(0,10);ac.closedBy=currentUser.name;if(!w.history)w.history=[];w.history.unshift(ac);w.cycles=[];save();renderAdmin();showToast("Cycle archived");}
function reopenCycle(wid,cid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const idx=(w.history||[]).findIndex(c=>c.id===cid);if(idx<0)return;const c=w.history.splice(idx,1)[0];delete c.closed;delete c.closedBy;if(w.cycles&&w.cycles.length){w.cycles[0].closed=new Date().toISOString().slice(0,10);w.history.unshift(w.cycles[0]);}w.cycles=[c];save();renderAdmin();showToast("Cycle reopened");}
function updCycleStatus(wid,tid,val){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac)return;const t=ac.tasks.find(x=>x.id===tid);if(!t)return;const prev=t.status;t.status=val;if(val==="Complete"&&prev!=="Complete"){if(!t.actualDate)t.actualDate=new Date().toISOString().slice(0,10);showCelebration(t.name);}save();renderAdmin();}
function updCycleDue(wid,tid,val){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac)return;const t=ac.tasks.find(x=>x.id===tid);if(!t)return;t.due=val;save();}
function toggleMeetingSetup(wid,tid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac)return;const t=ac.tasks.find(x=>x.id===tid);if(!t)return;t.meetingSetup=!t.meetingSetup;save();renderAdmin();}
function addCycleTask(wid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac){showToast("No active cycle");return;}const n=(document.getElementById("wf_nt_"+wid)||{}).value?.trim();if(!n)return;const ph=(document.getElementById("wf_ph_"+wid)||{}).value||"";const due=(document.getElementById("wf_dt_"+wid)||{}).value||"";const mx=ac.tasks.reduce((m,t)=>Math.max(m,t.id),0);ac.tasks.push({id:mx+1,name:n,phase:ph,owner:currentUser.name,due,originalDue:due,dueHistory:[],status:"Not started",priority:"Medium",geo:"Group",estHrs:3,loggedHrs:0,actualDate:"",notes:"",stakeholders:"",meetingNeeded:false,meetingSetup:false,meetingComment:"",meetingOwner:"",subtasks:[],taskNotes:[]});document.getElementById("wf_nt_"+wid).value="";save();renderAdmin();showToast("Task added");}
function openEditCycleTask(wid,tid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac)return;const t=ac.tasks.find(x=>x.id===tid);if(!t)return;showModal(`<h3>Edit task</h3><div class="modal-field"><label>Name</label><input id="ect_n" value="${t.name.replace(/"/g,"&quot;")}" /></div><div class="modal-field"><label>Phase</label><select id="ect_ph">${["Setup / Kickoff","Bookings & Inputs","Reviews","Exec Reviews","Finalise & Board"].map(p=>`<option ${t.phase===p?"selected":""}>${p}</option>`).join("")}</select></div><div class="modal-field"><label>Notes</label><input id="ect_no" value="${(t.notes||"").replace(/"/g,"&quot;")}" /></div><div class="modal-field"><label>Stakeholders</label><input id="ect_st" value="${(t.stakeholders||"").replace(/"/g,"&quot;")}" /></div><div class="modal-field"><label>Meeting needed</label><select id="ect_mn"><option value="false" ${!t.meetingNeeded?"selected":""}>No</option><option value="true" ${t.meetingNeeded?"selected":""}>Yes</option></select></div><div class="modal-field"><label>Meeting set up</label><select id="ect_ms"><option value="false" ${!t.meetingSetup?"selected":""}>No</option><option value="true" ${t.meetingSetup?"selected":""}>Yes</option></select></div><div class="modal-field"><label>Meeting owner</label><input id="ect_mo" value="${(t.meetingOwner||"").replace(/"/g,"&quot;")}" /></div><div class="modal-field"><label>Meeting comment</label><input id="ect_mc" value="${(t.meetingComment||"").replace(/"/g,"&quot;")}" /></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditCycleTask(${wid},${tid})">Save</button></div>`);}
function saveEditCycleTask(wid,tid){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const ac=activeCycle(w);if(!ac)return;const t=ac.tasks.find(x=>x.id===tid);if(!t)return;t.name=document.getElementById("ect_n").value.trim()||t.name;t.phase=document.getElementById("ect_ph").value;t.notes=document.getElementById("ect_no").value;t.stakeholders=document.getElementById("ect_st").value;t.meetingNeeded=document.getElementById("ect_mn").value==="true";t.meetingSetup=document.getElementById("ect_ms").value==="true";t.meetingOwner=document.getElementById("ect_mo").value;t.meetingComment=document.getElementById("ect_mc").value;save();closeModal();renderAdmin();showToast("Task updated");}

// ── User management ───────────────────────────────────────────────────────────
function openUserMgmt(){const existing=document.getElementById("user-mgmt-ov");if(existing)existing.remove();const members=getTeamMembers();const ov=document.createElement("div");ov.id="user-mgmt-ov";ov.style.cssText="position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px";ov.onclick=e=>{if(e.target===ov)ov.remove();};ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:440px;max-width:100%;box-shadow:var(--shadowmd)"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font-size:14px;font-weight:500;color:var(--navy)">👥 Team members</div><button onclick="document.getElementById('user-mgmt-ov').remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3)">×</button></div><div style="font-size:12px;color:var(--text2);margin-bottom:12px;background:var(--bg);border-radius:var(--rsm);padding:7px 10px">🔒 Team password: <strong>FP&ANinjas</strong></div><div style="margin-bottom:14px;max-height:220px;overflow-y:auto">${members.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)">${av(m,24)}<span style="flex:1;font-size:13px">${m}</span>${m===ADMIN?'<span style="font-size:10px;background:var(--amberbg);color:var(--amber);border-radius:99px;padding:2px 8px">Admin</span>':'<span style="font-size:10px;background:var(--bluelt);color:var(--blue);border-radius:99px;padding:2px 8px">Member</span>'}${m!==ADMIN?`<button data-member="${m}" onclick="removeTeamMember(this.getAttribute('data-member'))" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:16px;padding:0 3px">×</button>`:""}</div>`).join("")}</div><div style="display:flex;gap:8px;border-top:1px solid var(--border);padding-top:12px"><input id="new-member-n" type="text" placeholder="New member name..." style="flex:1;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text);font-family:var(--font)" onkeydown="if(event.key==='Enter')addTeamMember()" /><button class="btn btn-primary" onclick="addTeamMember()">Add</button></div></div>`;document.body.appendChild(ov);setTimeout(()=>document.getElementById("new-member-n")?.focus(),50);}
function addTeamMember(){const el=document.getElementById("new-member-n");if(!el)return;const n=el.value.trim();if(!n)return;if(!state.teamMembers)state.teamMembers=getTeamMembers();if(state.teamMembers.includes(n)){showToast("Already exists");return;}state.teamMembers.push(n);save();el.value="";openUserMgmt();showToast(n+" added");}
function removeTeamMember(n){if(!n)return;if(!state.teamMembers)state.teamMembers=getTeamMembers();state.teamMembers=state.teamMembers.filter(m=>m!==n);save();openUserMgmt();showToast(n+" removed");}

function exportDataBackup(){const b={version:"sogelink_fpa_v1",exported:new Date().toISOString(),exportedBy:currentUser?currentUser.name:"Unknown",data:state};const j=JSON.stringify(b,null,2);const existing=document.getElementById("backup-ov");if(existing)existing.remove();const ov=document.createElement("div");ov.id="backup-ov";ov.style.cssText="position:fixed;inset:0;background:rgba(10,22,40,0.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px";ov.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:520px;max-width:100%;box-shadow:var(--shadowmd);max-height:85vh;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:14px;font-weight:500;color:var(--navy)">💾 Data backup</div><button onclick="document.getElementById('backup-ov').remove()" style="background:none;border:none;font-size:18px;cursor:pointer">×</button></div><div style="font-size:13px;color:var(--text2)">Click Copy then paste into Notepad and save as backup.json</div><button onclick="navigator.clipboard.writeText(document.getElementById('backup-json').value).then(()=>{this.textContent='✓ Copied!';this.style.background='var(--green)';}).catch(()=>{document.getElementById('backup-json').select();document.execCommand('copy');this.textContent='✓ Copied!';})" style="background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font);align-self:flex-start">Copy to clipboard</button><textarea id="backup-json" readonly style="flex:1;min-height:200px;font-family:monospace;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:var(--rsm);background:#F8F9FA;resize:none">${j.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea></div>`;ov.onclick=e=>{if(e.target===ov)ov.remove();};document.body.appendChild(ov);}
function openImportModal(){const ov=document.createElement("div");ov.className="import-overlay";ov.id="import-ov";ov.onclick=e=>{if(e.target===ov)ov.remove();};ov.innerHTML=`<div class="import-modal"><h3 style="font-size:14px;font-weight:500;color:var(--navy);margin-bottom:8px">Restore from backup</h3><p style="font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:16px">Select a backup .json file previously exported from this tracker.</p><div class="import-drop" onclick="document.getElementById('import-fi').click()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleImportDrop(event)"><div style="font-size:24px;margin-bottom:6px">📂</div><div style="font-size:13px;color:var(--text2)">Click to select or drag & drop backup file</div></div><input type="file" id="import-fi" accept=".json" style="display:none" onchange="handleImportFile(this)" /><div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)"><button class="btn" onclick="document.getElementById('import-ov').remove()">Cancel</button></div></div>`;document.body.appendChild(ov);}
function handleImportDrop(e){e.preventDefault();e.currentTarget.classList.remove("dragover");const f=e.dataTransfer.files[0];if(f)processImport(f);}
function handleImportFile(input){const f=input.files[0];if(f)processImport(f);}
function processImport(file){if(!file.name.endsWith(".json")){showToast("Please select a .json file");return;}const reader=new FileReader();reader.onload=e=>{try{const b=JSON.parse(e.target.result);if(!b.data||!b.data.projects){showToast("Invalid backup file");return;}const pc=b.data.projects.length;const tc=b.data.projects.flatMap(p=>p.tasks).length;if(confirm(`Restore backup?\n\n${pc} projects, ${tc} tasks.\nThis replaces your current data.`)){state=b.data;localStorage.setItem("sogelink_fpa_live",JSON.stringify(state));save();document.getElementById("import-ov")?.remove();render();showToast(`Restored — ${pc} projects, ${tc} tasks`);}}catch(err){showToast("Could not read file");}};reader.readAsText(file);}
function exportWeeklyDigest(){const now=new Date();const allT=state.projects.flatMap(p=>p.tasks.map(t=>({...t,pName:p.name})));const in7=new Date(now);in7.setDate(in7.getDate()+7);const due=allT.filter(t=>t.status!=="Complete"&&t.due&&new Date(t.due+"T00:00:00")<=in7&&new Date(t.due+"T00:00:00")>=today).sort((a,b)=>a.due.localeCompare(b.due));const blk=allT.filter(t=>t.status==="Blocked");let h=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FP&A Digest</title><style>body{font-family:'Segoe UI',sans-serif;max-width:700px;margin:0 auto;padding:32px 24px;color:#0A1628;}h1{font-size:22px;font-weight:300;}h2{font-size:14px;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid #E5E7EB;}table{width:100%;border-collapse:collapse;font-size:13px;}th{text-align:left;padding:6px 10px;background:#F4F7FC;font-size:11px;font-weight:600;text-transform:uppercase;color:#6B7280;}td{padding:8px 10px;border-bottom:1px solid #F0F0F0;}</style></head><body><div style="font-size:11px;letter-spacing:0.06em;color:#1B5FA8;font-weight:600;margin-bottom:6px">SOGELINK · FP&A NINJAS</div><h1>Weekly Digest</h1><div style="font-size:13px;color:#6B7280;margin-bottom:20px">${now.toLocaleDateString("en-IE",{day:"numeric",month:"long",year:"numeric"})}</div>`;h+=`<h2>Project Status</h2><table><tr><th>Project</th><th>Progress</th><th>Due</th></tr>`;state.projects.forEach(p=>{h+=`<tr><td><strong>${p.name}</strong></td><td>${pct(p.tasks)}%</td><td>${fdShort(p.due)}</td></tr>`;});h+=`</table>`;if(due.length){h+=`<h2>Due This Week (${due.length})</h2><table><tr><th>Task</th><th>Project</th><th>Owner</th><th>Due</th></tr>`;due.forEach(t=>{h+=`<tr><td>${t.name}</td><td style="color:#6B7280;font-size:11px">${t.pName}</td><td>${t.owner}</td><td><strong>${fdShort(t.due)}</strong></td></tr>`;});h+=`</table>`;}if(blk.length){h+=`<h2>Blocked 🔴</h2><table><tr><th>Task</th><th>Project</th></tr>`;blk.forEach(t=>{h+=`<tr><td><strong>${t.name}</strong></td><td>${t.pName}</td></tr>`;});h+=`</table>`;}h+=`<div style="margin-top:32px;font-size:11px;color:#9CA3AF">Generated by FP&A Ninjas Tracker · Sogelink · ${now.toLocaleString("en-IE")}</div></body></html>`;const w=window.open("","_blank");if(w){w.document.open();w.document.write(h);w.document.close();}else showToast("Please allow popups");}
function exportExcel(){try{const wb=XLSX.utils.book_new();const sr=[["FP&A Ninjas"],["Exported",new Date().toLocaleDateString("en-IE")],[],["Project","Type","Owner","Due","Progress","Est hrs","Logged"]];state.projects.forEach(p=>{const pp=pct(p.tasks);const eh=p.tasks.reduce((a,t)=>a+(t.estHrs||0),0);const lh=p.tasks.reduce((a,t)=>a+(t.loggedHrs||0),0);sr.push([p.name,p.type,p.owner,p.due||"",pp+"%",eh,lh]);});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sr),"Summary");const tr=[["Project","Task","Owner","Due","Status","Priority","Est hrs"]];state.projects.forEach(p=>p.tasks.forEach(t=>tr.push([p.name,t.name,t.owner,t.due||"",t.status,t.priority,t.estHrs||0])));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tr),"Tasks");const d=new Date().toISOString().slice(0,10);try{XLSX.writeFile(wb,"fpa_tracker_"+d+".xlsx");}catch(e){const o=XLSX.write(wb,{bookType:"xlsx",type:"base64"});const a=document.createElement("a");a.href="data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+o;a.download="fpa_tracker_"+d+".xlsx";document.body.appendChild(a);a.click();document.body.removeChild(a);}}catch(e){showToast("Export failed: "+e.message);}}


function renderWorkflow(w){
  const wfTab=state.activeTab&&state.activeTab["wf_"+w.id]||"cycle";
  const ac=activeCycle(w);const pp=ac?cyclePct(ac):0;
  const isExp=state.expandedProjs&&state.expandedProjs["wf_"+w.id];
  return`<div class="proj-card" id="wf_${w.id}">
    <div class="proj-header" onclick="toggleWf(${w.id})">
      <span class="chevron ${isExp?"open":""}">&#9654;</span>
      <span class="proj-name">${w.name}</span>
      <span class="cadence-badge ${cadenceBadge(w.cadence)}">${cadenceLabel(w.cadence)}</span>
      ${ac?`<span style="font-size:12px;color:var(--text2)">${ac.label}</span><div class="prog-wrap"><div class="prog-bar ${pp===100?"done":""}" style="width:${pp}%"></div></div><span style="font-size:12px;color:var(--text2)">${pp}%</span>`:`<span style="font-size:12px;color:var(--text3)">No active cycle</span>`}
      <button class="btn btn-sm btn-primary" style="font-size:11px" onclick="event.stopPropagation();openStartCycle(${w.id})">+ New cycle</button>
      ${ac&&isAdmin()?`<button class="btn btn-sm" style="font-size:11px;border-color:var(--amber);color:var(--amber)" onclick="event.stopPropagation();closeCycle(${w.id})">📦 Archive</button>`:""}
      ${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteWf(${w.id})">Delete</button>`:""}
    </div>
    ${isExp?`<div class="proj-body">
      <div class="tabs" style="margin-bottom:8px">
        <div class="tab ${wfTab==="cycle"?"active":""}" onclick="setTab('wf_${w.id}','cycle')">Cycle tasks ${ac?"("+ac.tasks.filter(t=>t.status==="Complete").length+"/"+ac.tasks.length+" complete)":""}</div>
        <div class="tab ${wfTab==="timeline"?"active":""}" onclick="setTab('wf_${w.id}','timeline')">Timeline 🗓</div>
        <div class="tab ${wfTab==="gantt"?"active":""}" onclick="setTab('wf_${w.id}','gantt')">Gantt 📊</div>
        <div class="tab ${wfTab==="history"?"active":""}" onclick="setTab('wf_${w.id}','history')">History (${(w.history||[]).length})</div>
      </div>
      ${wfTab==="cycle"?renderActiveCycle(w,ac):wfTab==="timeline"?renderWorkflowTimeline(w):wfTab==="gantt"?renderWorkflowGantt(w,ac):renderHistory(w)}
    </div>`:""}
  </div>`;
}

function renderWorkflowsView(){
  const wfs=state.workflows||[];
  if(!wfs.length)return`<div class="empty" style="padding:48px;text-align:center"><div style="font-size:32px;margin-bottom:12px">🔄</div><div style="font-size:15px;font-weight:500">No workflows yet</div>${isAdmin()?`<button class="btn btn-primary" style="margin-top:12px" onclick="openAddWorkflow()">+ Add workflow</button>`:""}</div>`;
  return wfs.map(w=>renderWorkflow(w)).join("");
}

function openTaskThread(pid,tid,name){_threadPid=pid;_threadTid=tid;_threadTaskName=name;_threadIsWf=false;_openThread();}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadState().then(()=>render()).catch(e=>{console.error(e);try{render();}catch(e2){document.getElementById("app").innerHTML='<div style="padding:40px;color:red;font-family:monospace"><h2>Error</h2><pre>'+e2.message+'</pre></div>';}});

</script>
