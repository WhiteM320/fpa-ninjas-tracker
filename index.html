<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FP&A Ninjas — Sogelink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --navy: #0A1628;
  --navy-2: #142240;
  --navy-3: #1E3358;
  --blue: #1B5FA8;
  --blue-2: #2472C8;
  --blue-light: #E8F1FB;
  --blue-mid: #B8D4F5;
  --white: #FFFFFF;
  --bg: #F4F7FC;
  --surface: #FFFFFF;
  --border: #DDE4EF;
  --border-2: #C2CDE0;
  --text: #0A1628;
  --text-2: #4A5878;
  --text-3: #8A96AA;
  --accent: #1B5FA8;
  --gold: #C8960A;
  --gold-bg: #FDF6E0;
  --green: #0E6B4A;
  --green-bg: #E4F5EE;
  --red: #A81B1B;
  --red-bg: #FAEAEA;
  --amber: #8A5200;
  --amber-bg: #FDF2DC;
  --purple: #4A2AB8;
  --purple-bg: #EEEAF8;
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --shadow: 0 1px 4px rgba(10,22,40,0.08);
  --shadow-md: 0 4px 16px rgba(10,22,40,0.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* Topbar */
.topbar { background: var(--navy); border-bottom: 1px solid var(--navy-3); padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 58px; position: sticky; top: 0; z-index: 100; }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 32px; height: 32px; background: var(--blue-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; font-weight: 500; color: #fff; letter-spacing: -0.02em; }
.topbar-names { display: flex; flex-direction: column; }
.topbar-company { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 400; line-height: 1; margin-bottom: 2px; }
.topbar-team { font-size: 13px; color: #fff; font-weight: 500; line-height: 1; }
.topbar-divider { width: 1px; height: 24px; background: var(--navy-3); }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.7); }
.btn-topbar { padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.8); transition: all 0.12s; }
.btn-topbar:hover { background: rgba(255,255,255,0.1); color: #fff; }
.btn-topbar-primary { background: var(--blue-2); border-color: var(--blue-2); color: #fff; }
.btn-topbar-primary:hover { background: #1e84e0; }

/* Main */
.main { padding: 28px; max-width: 1200px; margin: 0 auto; width: 100%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 13px; font-weight: 400; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.12s; }
.btn:hover { background: var(--bg); border-color: var(--border-2); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: var(--blue-2); border-color: var(--blue-2); }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-success:hover { background: #0a5038; }
.btn-danger { color: var(--red); border-color: transparent; background: transparent; padding: 3px 8px; font-size: 12px; }
.btn-danger:hover { background: var(--red-bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-export { background: var(--navy); color: #fff; border-color: var(--navy); font-size: 12px; padding: 6px 12px; }
.btn-export:hover { background: var(--navy-2); }

/* Avatar */
.avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-family: var(--mono); flex-shrink: 0; }

/* Tags */
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
.tag-process { background: var(--purple-bg); color: var(--purple); }
.tag-reporting { background: var(--blue-light); color: var(--blue); }
.badge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.s-ns { background: #EEF0F4; color: #4A5878; }
.s-ip { background: var(--blue-light); color: var(--blue); }
.s-rv { background: var(--amber-bg); color: var(--amber); }
.s-co { background: var(--green-bg); color: var(--green); }
.s-bl { background: var(--red-bg); color: var(--red); }
.prio-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.p-h { background: #E24B4A; } .p-m { background: #EF9F27; } .p-l { background: var(--green); }
.due-ok { color: var(--text-3); font-size: 12px; }
.due-soon { color: var(--amber); font-weight: 500; font-size: 12px; }
.due-over { color: var(--red); font-weight: 500; font-size: 12px; }
.time-chip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; background: var(--blue-light); color: var(--blue); border-radius: 99px; white-space: nowrap; }
.time-chip-log { background: var(--green-bg); color: var(--green); }

/* Summary bar */
.summary-bar { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.sc { display: flex; flex-direction: column; gap: 5px; padding: 0 28px 0 0; margin-right: 28px; border-right: 1px solid var(--border); }
.sc:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.sc-label { font-size: 12px; color: var(--text-3); font-weight: 400; letter-spacing: 0; text-transform: none; font-family: var(--font); }
.sc-val { font-size: 32px; font-weight: 300; letter-spacing: -0.04em; color: var(--text); line-height: 1; }

/* Toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.toolbar input, .toolbar select { font-family: var(--font); font-size: 13px; padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); transition: border-color 0.12s; }
.toolbar input { flex: 1; min-width: 160px; }
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; box-shadow: var(--shadow); transition: box-shadow 0.15s; }
.card:hover { box-shadow: var(--shadow-md); }

/* Project header */
.proj-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; transition: background 0.1s; border-left: 3px solid transparent; }
.proj-header:hover { background: var(--bg); }
.proj-header.process { border-left-color: var(--purple); }
.proj-header.reporting { border-left-color: var(--blue-2); }
.proj-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 120px; }
.chevron { font-size: 10px; color: var(--text-3); transition: transform 0.15s; display: inline-block; }
.chevron.open { transform: rotate(90deg); }
.prog-wrap { width: 64px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-bar { height: 100%; background: var(--blue-2); border-radius: 99px; transition: width 0.3s; }
.prog-bar.done { background: var(--green); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; background: var(--bg); }
.tab { font-size: 12px; padding: 8px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.1s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }

/* Tables */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; padding: 7px 12px; font-size: 11px; font-weight: 500; color: var(--text-2); background: var(--bg); border-bottom: 1px solid var(--border); font-family: var(--mono); letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #F8FAFD; }
.add-row td { background: var(--bg); padding: 6px 10px; }
.add-row input, .add-row select { width: 100%; font-size: 12px; padding: 5px 7px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-family: var(--font); }
.add-row input:focus, .add-row select:focus { outline: none; border-color: var(--blue); }
.mini-sel { font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text); font-family: var(--font); width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }

/* Comments */
.comments-section { padding: 14px 18px; }
.comment { display: flex; gap: 10px; margin-bottom: 12px; }
.comment-body { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
.comment-author { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.comment-time { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
.comment-text { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.5; }
.comment-input-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
.comment-input-row textarea { flex: 1; font-family: var(--font); font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: none; min-height: 60px; }
.comment-input-row textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); }

/* Gantt */
.gantt-wrap { overflow-x: auto; padding: 14px 18px; }
.gantt-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.gantt-table th { background: var(--navy); color: rgba(255,255,255,0.7); font-size: 10px; font-family: var(--mono); letter-spacing: 0.04em; padding: 6px 8px; border: none; text-align: center; }
.gantt-table th.name-col { text-align: left; min-width: 180px; background: var(--navy-2); }
.gantt-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
.gantt-table td.name-col { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; background: var(--bg); }
.gantt-bar-cell { padding: 3px 4px; }
.gantt-bar { height: 18px; border-radius: 3px; min-width: 4px; display: inline-block; }
.gantt-bar-ns { background: #C2CDE0; }
.gantt-bar-ip { background: var(--blue-2); }
.gantt-bar-rv { background: #EF9F27; }
.gantt-bar-co { background: var(--green); }
.gantt-bar-bl { background: var(--red); opacity: 0.8; }
.gantt-today { border-left: 2px dashed var(--red); position: relative; }
.gantt-proj-row td { background: var(--navy); color: #fff; font-size: 11px; font-weight: 500; font-family: var(--mono); letter-spacing: 0.02em; }
.gantt-proj-row td.name-col { background: var(--navy-2); }

/* Stakeholders */
.stk-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; }
.stk-card { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
.stk-name { font-size: 13px; font-weight: 500; }
.stk-role-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-family: var(--mono); }
.stk-r { background: var(--blue-light); color: var(--blue); }
.stk-a { background: var(--gold-bg); color: var(--gold); }
.stk-c { background: var(--green-bg); color: var(--green); }
.stk-i { background: #EEF0F4; color: var(--text-2); }
.stk-add { display: flex; gap: 8px; padding: 0 18px 14px; flex-wrap: wrap; align-items: flex-end; }
.stk-add input, .stk-add select { font-family: var(--font); font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }

/* Login */
.login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--navy); padding: 20px; }
.login-brand { text-align: center; margin-bottom: 32px; }
.login-logo-mark { width: 52px; height: 52px; background: var(--blue-2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 16px; font-weight: 500; color: #fff; margin: 0 auto 14px; }
.login-company { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.login-team { font-size: 22px; color: #fff; font-weight: 300; letter-spacing: -0.02em; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 36px; width: 380px; max-width: 100%; box-shadow: var(--shadow-md); }
.login-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-2); margin-bottom: 24px; line-height: 1.5; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select { width: 100%; font-family: var(--font); font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); transition: border-color 0.12s; }
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); background: #fff; }
.login-actions { display: flex; gap: 8px; margin-top: 4px; }

/* My tasks */
.mt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 8px; box-shadow: var(--shadow); transition: box-shadow 0.15s, border-color 0.15s; border-left: 3px solid var(--border); }
.mt-card:hover { box-shadow: var(--shadow-md); border-left-color: var(--blue-2); }
.mt-card.blocked { border-left-color: var(--red); }
.mt-card.complete { border-left-color: var(--green); opacity: 0.7; }
.mt-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.mt-proj { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.mt-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.mt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mt-notes { font-size: 12px; color: var(--text-2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); line-height: 1.5; }
.section-head { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); margin-bottom: 10px; margin-top: 24px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.overdue-flag { background: var(--red-bg); color: var(--red); font-size: 10px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; font-family: var(--mono); }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; color: var(--navy); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(10,22,40,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; width: 520px; max-width: 100%; box-shadow: var(--shadow-md); }
.modal-title { font-size: 16px; font-weight: 500; margin-bottom: 20px; color: var(--navy); }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.fg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 110px; }
.fg label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2); }
.fg input, .fg select, .fg textarea { font-family: var(--font); font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); transition: border-color 0.12s; }
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,95,168,0.1); background: #fff; }
.fg textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.empty { text-align: center; padding: 32px; color: var(--text-3); font-size: 13px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-md); z-index: 999; animation: slideUp 0.2s ease; }
.toast-undo { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: #fff; border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: var(--font); }
.toast-undo:hover { background: rgba(255,255,255,0.15); }
@keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

.date-history { font-size:11px; color:var(--text-3); margin-top:2px; }
.date-history-entry { display:flex; align-items:center; gap:4px; margin-bottom:1px; }
.date-moved { color:var(--amber); }
.date-original { color:var(--text-3); text-decoration:line-through; }
.on-time-badge { font-size:10px; padding:2px 7px; border-radius:99px; font-family:var(--mono); white-space:nowrap; }
.ot-ontime { background:var(--green-bg); color:var(--green); }
.ot-late { background:var(--red-bg); color:var(--red); }
.ot-early { background:var(--blue-light); color:var(--blue); }
.ot-pending { background:#EEF0F4; color:var(--text-2); }
.date-cell { min-width:90px; }
.actual-date { font-size:12px; color:var(--green); font-weight:500; }
.slippage-warn { color:var(--amber); font-size:11px; }
.slippage-bad { color:var(--red); font-size:11px; }

.assignment-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.ap-individual{background:var(--blue-light);color:var(--blue);}
.ap-group{background:var(--green-bg);color:var(--green);}
.ap-subgroup{background:var(--purple-bg);color:var(--purple);}
.watcher-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.watcher-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 8px;font-size:11px;}
.group-badge{background:var(--green-bg);color:var(--green);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.subgroup-badge{background:var(--purple-bg);color:var(--purple);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.onboard-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;}
.onboard-icon{width:44px;height:44px;background:rgba(255,255,255,0.12);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.onboard-body{flex:1;}
.onboard-title{font-size:15px;font-weight:500;margin-bottom:4px;}
.onboard-sub{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5;}
.teams-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
.teams-section h3{font-size:14px;font-weight:500;margin-bottom:14px;color:var(--navy);}
.team-card{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;}
.team-members-wrap{display:flex;gap:-4px;flex-wrap:wrap;gap:4px;}
.assign-mode-sel{font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:var(--font);}

.main-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px;}
.main-tab{font-size:14px;padding:10px 22px;cursor:pointer;color:var(--text-2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .12s;font-weight:400;}
.main-tab:hover{color:var(--text);}
.main-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:500;}
.wf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s;}
.wf-card:hover{box-shadow:var(--shadow-md);}
.wf-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;flex-wrap:wrap;border-left:3px solid var(--blue-2);}
.wf-header:hover{background:var(--bg);}
.wf-name{font-size:14px;font-weight:500;flex:1;min-width:120px;}
.cadence-badge{font-size:11px;padding:2px 9px;border-radius:99px;font-family:var(--mono);white-space:nowrap;}
.c-monthly{background:#EEF0F4;color:var(--navy);}
.c-weekly{background:var(--blue-light);color:var(--blue);}
.c-quarterly{background:var(--purple-bg);color:var(--purple);}
.c-adhoc{background:var(--amber-bg);color:var(--amber);}
.cycle-banner{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.cycle-label{font-size:12px;color:var(--text-2);}
.cycle-val{font-size:13px;font-weight:500;color:var(--navy);}
.cycle-prog-wrap{flex:1;min-width:120px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.cycle-prog-bar{height:100%;background:var(--blue-2);border-radius:99px;transition:width .3s;}
.cycle-prog-bar.done{background:var(--green);}
.history-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;}
.history-row:last-child{border-bottom:none;}
.hist-name{flex:1;font-weight:500;}
.hist-stat{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;}
.hs-ok{background:var(--green-bg);color:var(--green);}
.hs-late{background:var(--red-bg);color:var(--red);}
.hs-partial{background:var(--amber-bg);color:var(--amber);}
.rel-day{font-family:var(--mono);font-size:11px;color:var(--text-3);}

.geo-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-family:var(--mono);font-weight:500;white-space:nowrap;letter-spacing:0.03em;}
.geo-FR{background:#EEF4FF;color:#1B4FA8;}
.geo-NL{background:#FFF3E0;color:#8A4500;}
.geo-NO{background:#FDEAEA;color:#A81B1B;}
.geo-Group{background:#0A1628;color:#FFFFFF;}
.geo-all{background:#EEF0F4;color:#3A3830;}

.celebrate-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 40px;text-align:center;z-index:1000;box-shadow:0 20px 60px rgba(10,22,40,0.18);min-width:300px;max-width:380px;animation:celebrateIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;}
@keyframes celebrateIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.75);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes celebrateOut{from{opacity:1;transform:translate(-50%,-50%) scale(1);}to{opacity:0;transform:translate(-50%,-50%) scale(0.85);}}
.celebrate-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.25);z-index:999;animation:fadeIn 0.2s ease forwards;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.celebrate-emoji{font-size:48px;margin-bottom:12px;display:block;animation:bounce 0.6s ease 0.3s both;}
@keyframes bounce{0%{transform:scale(1);}40%{transform:scale(1.3);}70%{transform:scale(0.9);}100%{transform:scale(1);}}
.celebrate-title{font-size:18px;font-weight:500;color:var(--navy);margin-bottom:6px;letter-spacing:-0.02em;}
.celebrate-msg{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:20px;}
.celebrate-name{font-weight:600;color:var(--blue);}
.celebrate-days{display:inline-block;background:var(--green-bg);color:var(--green);font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:99px;margin-bottom:14px;font-weight:500;}
.celebrate-close{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 24px;font-family:var(--font);font-size:13px;cursor:pointer;font-weight:500;}
.celebrate-close:hover{background:var(--navy-2);}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
.dash-grid-full{grid-column:1/-1;}
.dash-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.dash-section h3{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.rag-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.rag-row:last-child{border-bottom:none;}
.rag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.rag-green{background:var(--green);}.rag-amber{background:#EF9F27;}.rag-red{background:var(--red);}
.rag-name{flex:1;font-weight:500;}
.rag-meta{font-size:11px;color:var(--text-3);}
.due-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.due-item:last-child{border-bottom:none;}
.due-item-name{flex:1;}
.due-item-proj{font-size:11px;color:var(--text-3);}
.blocked-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.blocked-item:last-child{border-bottom:none;}
.geo-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;}
.geo-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.geo-bar-fill{height:100%;border-radius:99px;}
.dash-stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;}
.dash-stat{text-align:center;padding:10px 8px;background:var(--bg);border-radius:var(--radius-sm);}
.dash-stat-val{font-size:22px;font-weight:300;letter-spacing:-0.03em;}
.dash-stat-label{font-size:11px;color:var(--text-3);margin-top:2px;}
/* Date reason */
.date-reason-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.4);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.date-reason-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:420px;max-width:100%;box-shadow:var(--shadow-md);}
.date-reason-modal h3{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:6px;}
.date-reason-modal p{font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.5;}
.date-reason-modal input{width:100%;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);}
.date-reason-modal input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,95,168,0.1);}
.date-reason-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
/* Subtasks */
.subtask-wrap{padding:0 0 0 32px;border-left:2px solid var(--blue-light);margin:0 0 0 18px;}
.subtask-row{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:0.5px solid var(--border);font-size:12px;}
.subtask-row:last-child{border-bottom:none;}
.subtask-row:hover{background:var(--bg);}
.subtask-check{width:14px;height:14px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;}
.subtask-name{flex:1;color:var(--text);}
.subtask-name.done{text-decoration:line-through;color:var(--text-3);}
.subtask-owner{font-size:11px;color:var(--text-3);white-space:nowrap;}
.subtask-due{font-size:11px;white-space:nowrap;}
.subtask-add-row{display:flex;gap:6px;padding:6px 12px;background:var(--bg);align-items:center;}
.subtask-add-row input,.subtask-add-row select{font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:var(--font);}
.task-expand-btn{font-size:10px;color:var(--text-3);cursor:pointer;padding:1px 5px;border-radius:3px;border:none;background:transparent;}
.task-expand-btn:hover{background:var(--bg);color:var(--text);}
.notes-panel{padding:10px 18px 12px;border-top:0.5px solid var(--border);background:var(--bg);}
.notes-panel label{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em;color:var(--text-2);display:block;margin-bottom:5px;}
.notes-panel textarea{width:100%;font-family:var(--font);font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);resize:vertical;min-height:70px;line-height:1.5;}
/* Comment thread */
.task-thread-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.task-thread-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:520px;max-width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md);}
.task-thread-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.task-thread-title{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:2px;}
.task-thread-sub{font-size:12px;color:var(--text-2);}
.task-thread-body{flex:1;overflow-y:auto;padding:16px 22px;}
.tn-comment{display:flex;gap:10px;margin-bottom:14px;}
.tn-comment-body{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.tn-comment-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.tn-comment-author{font-size:12px;font-weight:500;color:var(--text);}
.tn-comment-ts{font-size:11px;color:var(--text-3);font-family:var(--mono);}
.tn-comment-text{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.tn-mention{background:var(--blue-light);color:var(--blue);border-radius:3px;padding:0 3px;font-weight:500;}
.tn-tagged-banner{background:var(--amber-bg);border:1px solid #F5D8A0;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;color:var(--amber);margin-bottom:12px;}
.task-thread-input{padding:14px 22px 18px;border-top:1px solid var(--border);flex-shrink:0;}
.thread-textarea-wrap{position:relative;}
.thread-textarea{width:100%;font-family:var(--font);font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);resize:none;min-height:80px;line-height:1.6;}
.thread-textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,95,168,0.1);}
.mention-dropdown{position:absolute;bottom:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:400;min-width:180px;max-height:160px;overflow-y:auto;}
.mention-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;cursor:pointer;}
.mention-item:hover{background:var(--bg);}
.thread-hint{font-size:11px;color:var(--text-3);}
.thread-actions{display:flex;gap:8px;}
.tn-empty{text-align:center;padding:24px;color:var(--text-3);font-size:13px;}
.translation-block{margin-top:5px;padding:6px 10px;background:var(--blue-light);border-left:3px solid var(--blue-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;color:var(--blue);line-height:1.5;}
.translation-block .tl-label{font-size:10px;font-family:var(--mono);color:var(--blue);opacity:0.7;margin-bottom:2px;}
/* Lang toggle */
.lang-toggle{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.1);border-radius:99px;padding:3px 6px;font-size:11px;font-family:var(--mono);}
.lang-btn{background:transparent;border:none;color:rgba(255,255,255,0.6);cursor:pointer;padding:2px 6px;border-radius:99px;font-family:var(--mono);font-size:11px;}
.lang-btn.active{background:rgba(255,255,255,0.2);color:#fff;}
.translate-btn{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--blue-light);background:var(--blue-light);color:var(--blue);cursor:pointer;font-family:var(--mono);margin-left:5px;}
.translated-label{font-size:10px;background:var(--green-bg);color:var(--green);border-radius:99px;padding:1px 6px;font-family:var(--mono);margin-left:4px;}
/* Backup */
.import-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
.import-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;width:440px;max-width:100%;box-shadow:var(--shadow-md);}
.import-modal h3{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:6px;}
.import-modal p{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:18px;}
.import-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;}
.import-drop:hover,.import-drop.dragover{border-color:var(--blue);background:var(--blue-light);}
.import-drop-label{font-size:13px;color:var(--text-2);}
.import-drop-sub{font-size:11px;color:var(--text-3);margin-top:4px;}
.import-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
/* Main tabs */
.main-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px;}
.main-tab{font-size:14px;padding:10px 22px;cursor:pointer;color:var(--text-2);border-bottom:3px solid transparent;margin-bottom:-2px;}
.main-tab:hover{color:var(--text);}
.main-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:500;}

/* Phase badge */
.phase-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-family:var(--mono);white-space:nowrap;font-weight:500;}
.phase-setup{background:#EEF0F4;color:#2A3858;}
.phase-bookings{background:#E8F1FB;color:#1B5FA8;}
.phase-reviews{background:#FDF0DC;color:#8A5200;}
.phase-exec{background:#FAEAEA;color:#A81B1B;}
.phase-finalise{background:#E4F5EE;color:#0E6B4A;}
/* Meeting tracking */
.meeting-cell{display:flex;flex-direction:column;gap:3px;}
.meeting-status{display:flex;align-items:center;gap:4px;font-size:11px;}
.meeting-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.m-needed{background:#EF9F27;}
.m-setup{background:#1D9E75;}
.m-none{background:#C2CDE0;}
.meeting-owner{font-size:10px;color:var(--text-3);font-family:var(--mono);}
.meeting-comment{font-size:10px;color:var(--text-2);font-style:italic;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Stakeholder groups */
.stk-group-tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--purple-bg);color:var(--purple);font-family:var(--mono);white-space:nowrap;}
.stk-group-tag.team{background:var(--blue-light);color:var(--blue);}
.stk-group-tag.exec{background:#FDF0DC;color:#8A5200;}
.stk-group-tag.external{background:#FAEAEA;color:#A81B1B;}
/* Stakeholder view */
.stk-view-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);}
.stk-view-section h3{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.stk-dep-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.stk-dep-item:last-child{border-bottom:none;}
.stk-dep-source{font-size:11px;color:var(--text-3);min-width:80px;}
.stk-dep-name{flex:1;font-weight:500;}
.stk-dep-role{font-size:11px;color:var(--text-2);}

/* Workflow timeline presentation */
.wf-timeline-wrap{padding:20px;background:var(--surface);}
.wf-timeline-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.wf-timeline-title{font-size:18px;font-weight:300;color:var(--navy);letter-spacing:-0.02em;}
.wf-timeline-sub{font-size:13px;color:var(--text-2);}
.wf-phase-group{margin-bottom:24px;}
.wf-phase-label{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.wf-timeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.wf-tl-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;position:relative;border-left:3px solid var(--border);}
.wf-tl-card.phase-setup{border-left-color:#4A5878;}
.wf-tl-card.phase-bookings{border-left-color:var(--blue-2);}
.wf-tl-card.phase-reviews{border-left-color:#EF9F27;}
.wf-tl-card.phase-exec{border-left-color:var(--red);}
.wf-tl-card.phase-finalise{border-left-color:var(--green);}
.wf-tl-card-name{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:5px;line-height:1.4;}
.wf-tl-card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-2);}
.wf-tl-day{font-family:var(--mono);font-size:10px;color:var(--text-3);}
.print-btn{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;cursor:pointer;font-family:var(--font);}
.print-btn:hover{background:var(--navy-2);}
@media print{
  .topbar,.main-tabs,.toolbar,.btn,.tab{display:none!important;}
  .wf-timeline-wrap{padding:0;}
  .print-btn{display:none!important;}
  body{background:#fff;}
  .wf-tl-card{break-inside:avoid;}
}

.workspace-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.workspace-tab{font-size:13px;padding:8px 18px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;white-space:nowrap;}
.workspace-tab:hover{color:var(--text);}
.workspace-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.member-proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .15s;}
.member-proj-card:hover{box-shadow:var(--shadow-md);}
.member-proj-header{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.member-proj-name{font-size:14px;font-weight:500;flex:1;}
.member-proj-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.member-wf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .15s;border-left:3px solid var(--blue-2);}
.member-wf-card:hover{box-shadow:var(--shadow-md);}
.member-wf-header{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.member-wf-name{font-size:14px;font-weight:500;flex:1;}
.member-wf-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.member-phase-section{margin-bottom:12px;}
.member-phase-label{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--text-3);margin-bottom:6px;}
.member-task-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.member-task-row:last-child{border-bottom:none;}
.member-task-name{flex:1;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;width:420px;max-width:100%;box-shadow:var(--shadow-md);}
.modal-box h3{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:16px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.04em;color:var(--text-2);margin-bottom:5px;}

function onTimeStatus(t) {
  if (!t.actualDate) return 'pending';
  if (!t.due) return 'pending';
  const actual = new Date(t.actualDate + 'T00:00:00');
  const target = new Date(t.due + 'T00:00:00');
  const diff = Math.round((actual - target) / 86400000);
  if (diff <= 0) return 'early';
  if (diff <= 3) return 'ontime';
  return 'late';
}
function onTimeBadge(t) {
  if (!t.actualDate) return '<span class="on-time-badge ot-pending">Pending</span>';
  const actual = new Date(t.actualDate + 'T00:00:00');
  const target = new Date(t.due + 'T00:00:00');
  const diff = Math.round((actual - target) / 86400000);
  if (diff < 0) return `<span class="on-time-badge ot-early">Early by ${Math.abs(diff)}d</span>`;
  if (diff === 0) return `<span class="on-time-badge ot-ontime">On time</span>`;
  if (diff <= 3) return `<span class="on-time-badge ot-ontime">+${diff}d</span>`;
  return `<span class="on-time-badge ot-late">+${diff}d late</span>`;
}
function slippageDays(t) {
  if (!t.originalDue || !t.due) return 0;
  return Math.round((new Date(t.due+'T00:00:00') - new Date(t.originalDue+'T00:00:00')) / 86400000);
}
function updateTargetDate(pid, tid, newDue) {

  const ts = now.toLocaleDateString('en-IE',{day:'numeric',month:'short'}) + ', ' + now.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
  if (!t.dueHistory) t.dueHistory = [];

  t.due = newDue;
  save(); renderAdmin();
}

function showCelebration(taskName, ownerName, daysEarly) {

  const daysText = daysEarly === 1 ? "1 day early" : `${daysEarly} days early`;

  const overlay = document.createElement("div");

  overlay.id = "celebrate-overlay";

  const toast = document.createElement("div");

  toast.innerHTML = `
    <span class="celebrate-emoji">${msg.emoji}</span>

    <div class="celebrate-msg"><span class="celebrate-name">${ownerName}</span> completed <em>${taskName}</em> ahead of schedule. ${msg.msg}</div>
    <button class="celebrate-close" onclick="dismissCelebration()">Keep it up 👊</button>
  `;

  overlay.appendChild(toast);
  document.body.appendChild(overlay);

  // Auto-dismiss after 8 seconds
  setTimeout(() => dismissCelebration(), 8000);
}

function dismissCelebration() {
  const overlay = document.getElementById("celebrate-overlay");
  if (!overlay) return;
  overlay.style.animation = "fadeIn 0.2s ease reverse forwards";
  const toast = overlay.querySelector(".celebrate-toast");
  if (toast) toast.style.animation = "celebrateOut 0.25s ease forwards";
  setTimeout(() => overlay.remove(), 250);
}

function doUndo() {
  const item = undoStack.pop();
  if (!item) return;
  const existing = document.getElementById("undo-toast");
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);
  if (item.type === "project") {
    state.projects.splice(item.data.index, 0, item.data.project);
    save(); renderAdmin();
  } else if (item.type === "task") {
    const p = state.projects.find(x => x.id === item.data.pid);
    if (p) { p.tasks.splice(item.data.index, 0, item.data.task); save(); renderAdmin(); }
  }
}

function allOwners(){const s=new Set();state.projects.forEach(p=>{s.add(p.owner);p.tasks.forEach(t=>s.add(t.owner));});return[...s].filter(Boolean).sort();}

function wfStats(){
  const wfs = state.workflows||[];
  const cycles = wfs.map(w=>activeCycle(w)).filter(Boolean);
  const allTasks = cycles.flatMap(c=>c.tasks||[]);
  return {
    activeCycles: cycles.length,
    totalTasks: allTasks.length,
    complete: allTasks.filter(t=>t.status==='Complete').length,
    meetingsSetup: allTasks.filter(t=>t.meetingNeeded&&t.meetingSetup).length,
    meetingsNeeded: allTasks.filter(t=>t.meetingNeeded&&!t.meetingSetup).length,
    frTasks: allTasks.filter(t=>t.geo==='FR').length,
  };
}

function stkStats(){
  const stkSet = new Set();
  let projectDeps=0, workflowDeps=0;
  state.projects.forEach(p=>{
    (p.stakeholders||[]).forEach(s=>{stkSet.add(s.name);projectDeps++;});
    p.tasks.forEach(t=>{(t.stakeholders||'').split(',').filter(Boolean).forEach(s=>{stkSet.add(s.trim());projectDeps++;});});
  });
  (state.workflows||[]).forEach(w=>{
    const ac=activeCycle(w);
    if(ac)(ac.tasks||[]).forEach(t=>{(t.stakeholders||'').split(',').filter(Boolean).forEach(s=>{stkSet.add(s.trim());workflowDeps++;});});
  });
  return {total:stkSet.size, projectDeps, workflowDeps};
}


// ── Role helpers ──────────────────────────────────────────────────────────────
function isAdmin(){ return currentUser && currentUser.role === 'admin'; }
function canDelete(){ return isAdmin(); }
function canEdit(){ return !!currentUser; }  // all logged-in users

function gStats(){
  const at=state.projects.flatMap(p=>p.tasks);
  const completed=at.filter(t=>t.actualDate);
  return{
    projects:state.projects.length,tasks:at.length,
    blocked:at.filter(t=>t.status==="Blocked").length,
    overdue:at.filter(t=>{if(!t.due||t.status==="Complete")return false;return new Date(t.due+"T00:00:00")<today;}).length,
    done:state.projects.filter(p=>pct(p.tasks)===100).length,
    anyEst:state.projects.some(p=>p.estEnabled),
    estHrs:Math.round(at.reduce((a,t)=>a+(t.estHrs||0),0)*10)/10,
    logHrs:Math.round(at.reduce((a,t)=>a+(t.loggedHrs||0),0)*10)/10,
    onTime:completed.filter(t=>onTimeStatus(t)!=='late').length,
    late:completed.filter(t=>onTimeStatus(t)==='late').length
  };
}

const TEAM_PASSWORD = "FP&ANinjas";
const ADMIN_NAME = "M. White";

function getTeamMembers(){
  if(state && state.teamMembers && state.teamMembers.length) return state.teamMembers;
  const fromState = allOwners();
  if(fromState.length) return fromState;
  return [ADMIN_NAME,'Louis','Rayane','Alex','Antoine','Martin'];
}

function doLogin(){
  const v = document.getElementById("lSel").value;
  if(!v){ showLoginError("Please select your name."); return; }
  const pass = (document.getElementById("loginPass")||{}).value||"";
  if(pass !== TEAM_PASSWORD){ showLoginError("Incorrect password. Please try again."); return; }
  currentUser = {name:v, role: v===ADMIN_NAME ? "admin" : "member"};
  // Save credentials if remember me is checked
  const rememberMe = document.getElementById("rememberMe");
  try{ localStorage.setItem("fpa_last_user", v); }catch(e){}
  if(rememberMe && rememberMe.checked){
    try{
      localStorage.setItem("fpa_remembered_user", JSON.stringify({name:v, ts: Date.now()}));
    }catch(e){}
  } else {
    localStorage.removeItem("fpa_remembered_user");
  }
  render();
}

function showLoginError(msg){
  let el = document.getElementById("login-error");
  if(!el){
    el = document.createElement("div");
    el.id = "login-error";
    el.style.cssText = "color:var(--red,#A81B1B);font-size:13px;margin-top:8px;text-align:center;padding:8px;background:#FAEAEA;border-radius:6px";
    const actions = document.querySelector(".login-actions");
    if(actions) actions.parentNode.insertBefore(el, actions);
  }
  el.textContent = msg;
  setTimeout(()=>{if(el)el.remove();}, 3000);
}

function doAdmin(){currentUser={name:ADMIN_NAME,role:"admin"};render();}
function logout(){
  currentUser=null;
  localStorage.removeItem("fpa_remembered_user");
  render();
}




// ── Workflow helpers ──────────────────────────────────────────────────────────
function cadenceBadge(c){return{monthly:"c-monthly",weekly:"c-weekly",quarterly:"c-quarterly","ad hoc":"c-adhoc"}[c]||"c-adhoc";}
function cadenceLabel(c){return{monthly:"Monthly",weekly:"Weekly",quarterly:"Quarterly","ad hoc":"Ad hoc"}[c]||c;}

function calcDueDate(anchorDate, relDay) {
  if(!anchorDate) return "";
  const d = new Date(anchorDate + "T00:00:00");
  d.setDate(d.getDate() + relDay - 1);
  return d.toISOString().slice(0,10);
}

function activeCycle(w) {
  return w.cycles && w.cycles.length ? w.cycles[w.cycles.length-1] : null;
}

function cyclePct(cycle) {
  if(!cycle||!cycle.tasks||!cycle.tasks.length) return 0;
  return Math.round(cycle.tasks.filter(t=>t.status==="Complete").length/cycle.tasks.length*100);
}

function renderWorkflowsView() {
  if(!state.workflows||!state.workflows.length) return `<div class="empty">No workflows yet. Create one with + New workflow.</div>`;
  return state.workflows.map(w => renderWorkflow(w)).join("");
}

function renderWorkflow(w) {
  const ac = activeCycle(w);
  const pp = cyclePct(ac);
  const wfTab = state.activeTab["wf_"+w.id] || "cycle";
  return `<div class="wf-card">
    <div class="wf-header" onclick="toggleWf(${w.id})">
      <span class="chevron ${w.expanded?'open':''}">&#9654;</span>
      <span class="wf-name">${w.name}</span>
      <span class="cadence-badge ${cadenceBadge(w.cadence)}">${cadenceLabel(w.cadence)}</span>
      ${ac?`<span style="font-size:12px;color:var(--text-2)">Cycle: ${fdShort(ac.start)} → ${fdShort(ac.anchor)}</span>`:'<span style="font-size:12px;color:var(--text-3)">No active cycle</span>'}
      ${ac?`<div class="cycle-prog-wrap"><div class="cycle-prog-bar ${pp===100?'done':''}" style="width:${pp}%"></div></div><span style="font-size:12px;color:var(--text-2)">${pp}%</span>`:''}
      <button class="btn btn-sm btn-primary" style="margin-left:4px" onclick="event.stopPropagation();openStartCycle(${w.id})">&#9654; New cycle</button>
      ${ac&&isAdmin()?`<button class="btn btn-sm" style="font-size:12px;border-color:var(--amber);color:var(--amber)" onclick="event.stopPropagation();closeCycle(${w.id})">📦 Archive cycle</button>`:''}
      ${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteWf(${w.id})">Delete</button>`:''}
    </div>
    ${w.expanded?`
    <div class="tabs">
      <div class="tab ${wfTab==='cycle'?'active':''}" onclick="setTab('wf_${w.id}','cycle')">Active cycle${ac?` (${ac.tasks.filter(t=>t.status==='Complete').length}/${ac.tasks.length})`:''}
      </div>
      <div class="tab ${wfTab==='template'?'active':''}" onclick="setTab('wf_${w.id}','template')">Template (${w.template.length} tasks)</div>
      <div class="tab ${wfTab==='timeline'?'active':''}" onclick="setTab('wf_${w.id}','timeline')">Timeline 🗓</div>
      <div class="tab ${wfTab==='gantt'?'active':''}" onclick="setTab('wf_${w.id}','gantt')">Gantt 📊</div>
      <div class="tab ${wfTab==='history'?'active':''}" onclick="setTab('wf_${w.id}','history')">Cycle history (${w.history.length})</div>
    </div>
    ${wfTab==='cycle'?renderActiveCycle(w,ac)
      :wfTab==='template'?renderTemplate(w)
      :wfTab==='timeline'?renderWorkflowTimeline(w)
      :wfTab==='gantt'?renderWorkflowGantt(w,ac)
      :renderHistory(w)}
    `:''}
  </div>`;
}

function renderActiveCycle(w, ac) {
  if(!ac) return `<div class="empty" style="padding:28px">
    No active cycle. Hit <strong>New cycle</strong> to start one.<br>
    <span style="font-size:12px;color:var(--text-3);margin-top:4px;display:block">Tasks will be auto-created from the template with due dates calculated from your anchor date.</span>
  </div>`;
  const rows = ac.tasks.map(t=>`<tr>
    <td style="width:24%">${t.name}</td>
    <td style="width:11%"><span class="chip">${av(t.owner,20)} ${t.owner}</span></td>
    <td style="width:10%"><span class="${dc(t.due,t.status)}">${fdShort(t.due)}</span></td>
    <td style="width:9%"><span class="rel-day">Day ${t.relDay>0?'+':''}${t.relDay}</span></td>
    <td style="width:14%"><select class="mini-sel" onchange="updCycleStatus(${w.id},${t.id},this.value)">${["Not started","In progress","Review","Complete","Blocked"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
    <td style="width:8%"><span class="prio-dot ${pcls(t.priority)}"></span>${t.priority}</td>
    <td style="width:8%;text-align:right"><span class="time-chip">${fh(t.estHrs)}</span></td>
    <td style="width:16%;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.notes||"—"}</td>
  </tr>`).join("");

  const allDone = ac.tasks.every(t=>t.status==="Complete");
  return `
  <div class="cycle-banner">
    <span class="cycle-label">Anchor date</span><span class="cycle-val">${fdShort(ac.anchor)} (${w.anchorLabel})</span>
    <span class="cycle-label" style="margin-left:12px">Started</span><span class="cycle-val">${fdShort(ac.start)}</span>
    <span class="cycle-label" style="margin-left:12px">Tasks complete</span><span class="cycle-val">${ac.tasks.filter(t=>t.status==="Complete").length} / ${ac.tasks.length}</span>
    ${allDone?`<button class="btn btn-success btn-sm" onclick="closeCycle(${w.id})">Close cycle ✓</button>`:""}
  </div>
  <table><thead><tr>
    <th style="width:16%">Task</th><th style="width:12%">Phase</th><th style="width:8%">Owner</th><th style="width:5%">Geo</th><th style="width:8%">Due date</th><th style="width:7%">Rel. day</th>
    <th style="width:10%">Status</th><th style="width:6%">Priority</th><th style="width:10%">Meeting</th><th style="width:5%;text-align:right">Est</th><th style="width:13%">Notes</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderTemplate(w) {
  const rows = w.template.map(t=>`<tr>
    <td style="width:16%">${t.name}</td>
    <td style="width:11%">${phaseBadge(t.phase||'')}</td>
    <td style="width:9%"><span class="chip">${av(t.owner,20)} ${t.owner}</span></td>

    <td style="width:18%;font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.stakeholders||''}">${t.stakeholders||'—'}</td>
    <td style="width:5%;text-align:right"><span class="time-chip">${fh(t.estHrs)}</span></td>

      ${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="delTmplTask(${w.id},${t.id})">×</button>`:''}
    </td>
  </tr>`).join("");
  return `<table><thead><tr>
    <th style="width:16%">Task</th><th style="width:11%">Phase</th><th style="width:9%">Owner</th><th style="width:5%">Geo</th><th style="width:8%">Rel. day</th>
    <th style="width:7%">Priority</th><th style="width:9%">Meeting</th><th style="width:18%">Stakeholders</th><th style="width:5%;text-align:right">Est</th><th style="width:12%"></th>
  </tr></thead><tbody>
  ${rows}
  <tr class="add-row">
    <td><input type="text" id="tt_n_${w.id}" placeholder="Task name..." /></td>

    <td><input type="number" id="tt_e_${w.id}" placeholder="Hrs" min="0" step="0.5" /></td>

  </tr>
  </tbody></table>
  <div style="padding:12px 18px;font-size:12px;color:var(--text-3)">
    Relative days are calculated from the anchor date. Use negative numbers to set tasks before the anchor (e.g. Day -2 = 2 days before the board meeting).
  </div>`;
}

function renderHistory(w) {
  if(!w.history||!w.history.length) return `<div class="empty">No archived cycles yet. Use the Archive cycle button to close an active cycle and start a new one.</div>`;
  return `<div style="padding:8px 0">${w.history.map(h=>{
    const late=h.tasks?h.tasks.filter(t=>t.status!=="Complete").length:0;
    const total=h.tasks?h.tasks.length:0;
    const done=total-late;
    const cls=late===0?"hs-ok":late<total/2?"hs-partial":"hs-late";
    return `<div class="history-row" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);flex-wrap:wrap">
      <span class="hist-name" style="font-weight:500;min-width:140px">${h.label||"Cycle"}</span>
      <span style="font-size:12px;color:var(--text-2)">${fdShort(h.start)} → ${fdShort(h.closed)}</span>

// ── Workflow actions ──────────────────────────────────────────────────────────
function toggleWf(wid){const w=state.workflows.find(x=>x.id===wid);if(w)w.expanded=!w.expanded;save();renderAdmin();}

function toggleMeetingSetup(wid,tid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const ac=activeCycle(w);if(!ac)return;
  const t=ac.tasks.find(x=>x.id===tid);if(!t)return;
  t.meetingSetup=!t.meetingSetup;save();renderAdmin();
}
function updCycleStatus(wid,tid,val){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const ac=activeCycle(w);if(!ac)return;
  const t=ac.tasks.find(x=>x.id===tid);if(!t)return;
  const wasComplete=t.status==='Complete';
  t.status=val;
  if(val==="Complete"&&!t.actualDate){
    t.actualDate=new Date().toISOString().slice(0,10);
    if(!wasComplete && t.due){
      const target=new Date(t.due+'T00:00:00');
      const actual=new Date(t.actualDate+'T00:00:00');
      const daysEarly=Math.round((target-actual)/86400000);
      if(daysEarly>0){
        setTimeout(()=>showCelebration(t.name,t.owner||currentUser.name,daysEarly),400);
      }
    }
  }
  if(val!=="Complete")t.actualDate="";
  save();renderAdmin();
}

function closeCycle(wid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const ac=activeCycle(w);if(!ac)return;
  ac.closed=new Date().toISOString().slice(0,10);
  ac.label=ac.label||`${w.cadence==="monthly"?"Month":"Cycle"} ending ${fdShort(ac.anchor)}`;
  w.history.push({...ac});
  w.cycles=w.cycles.filter(c=>c.id!==ac.id);
  save();renderAdmin();
  showToast(`Cycle "${ac.label}" closed and archived.`);
}

function openStartCycle(wid){

      <div class="form-row">

function startCycle(wid){
  const w=state.workflows.find(x=>x.id===wid);if(!w)return;
  const anchor=document.getElementById("sc_anchor")?.value;if(!anchor)return;
  const label=document.getElementById("sc_label")?.value.trim();
  const cycleId=Date.now();
  const tasks=w.template.map((t,i)=>({
    ...JSON.parse(JSON.stringify(t)),
    id:cycleId+i,
    due:calcDueDate(anchor,t.relDay),
    status:"Not started",actualDate:"",loggedHrs:0,
    geo:t.geo||"Group",
    phase:t.phase||"",
    stakeholders:t.stakeholders||"",
    meetingNeeded:t.meetingNeeded||false,
    meetingSetup:t.meetingSetup||false,
    meetingComment:t.meetingComment||"",
    meetingOwner:t.meetingOwner||""
  }));
  if(!w.cycles)w.cycles=[];
  w.cycles.push({id:cycleId,anchor,start:new Date().toISOString().slice(0,10),label:label||"",tasks});
  w.expanded=true;
  state.activeTab["wf_"+wid]="cycle";
  modalHtml=null;save();renderAdmin();
  showToast(`Cycle started — ${tasks.length} tasks created.`);
}

// ── Assignment helpers ────────────────────────────────────────────────────────
const FULL_GROUP = "__group__";

function getSubgroups() {
  if (!state.subgroups) state.subgroups = [
    { id: 1, name: "Planful Team", members: [] },
    { id: 2, name: "Reporting Squad", members: [] }
  ];
  return state.subgroups;
}

function resolveAssignees(t) {
  // Returns array of member names who should see this task
  if (t.assignMode === "group") return allOwners();
  if (t.assignMode === "subgroup" && t.subgroupId) {
    const sg = getSubgroups().find(s => s.id === t.subgroupId);
    return sg ? sg.members : [];
  }
  return [t.owner].filter(Boolean);
}

function taskVisibleTo(t, name) {
  const assignees = resolveAssignees(t);
  if (assignees.includes(name)) return true;
  if (t.watchers && t.watchers.includes(name)) return true;
  return false;
}

function assignModeLabel(t) {
  if (t.assignMode === "group") return `<span class="assignment-pill ap-group">&#128101; All FP&amp;A Ninjas</span>`;
  if (t.assignMode === "subgroup") {
    const sg = getSubgroups().find(s => s.id === t.subgroupId);
    return `<span class="assignment-pill ap-subgroup">&#128101; ${sg ? sg.name : "Sub-group"}</span>`;
  }
  return `<span class="assignment-pill ap-individual">&#128100; ${t.owner||"Unassigned"}</span>`;
}

function watcherChips(t) {
  if (!t.watchers || !t.watchers.length) return "";
  return `<div class="watcher-row">${t.watchers.map(w=>`<span class="watcher-chip">${av(w,16)} ${w}</span>`).join("")}</div>`;
}

function toggleSGMember(sgId, member, checked) {
  const sg = getSubgroups().find(s=>s.id===sgId); if(!sg) return;

  if (!checked) sg.members = sg.members.filter(m=>m!==member);
  save();
}

function renderStakeholderView() {
  // Collect all stakeholder groups across projects and workflows
  const stkMap = {}; // stakeholder -> [{source, name, type}]

  state.projects.forEach(p => {
    // Project-level stakeholders
    (p.stakeholders || []).forEach(s => {
      const key = s.name;
      if (!stkMap[key]) stkMap[key] = [];
      stkMap[key].push({ source: 'project', name: p.name, role: s.role, type: 'Project' });
    });
    // Task-level stakeholders
    p.tasks.forEach(t => {
      if (t.stakeholders) {
        const groups = t.stakeholders.split(',').map(x => x.trim()).filter(Boolean);
        groups.forEach(g => {
          if (!stkMap[g]) stkMap[g] = [];
          stkMap[g].push({ source: 'task', name: t.name, project: p.name, role: 'Task stakeholder', type: 'Task' });
        });
      }
    });
  });

  // Workflow tasks
  (state.workflows || []).forEach(w => {
    const ac = activeCycle(w);
    if (ac) {
      (ac.tasks || []).forEach(t => {
        if (t.stakeholders) {
          const groups = t.stakeholders.split(',').map(x => x.trim()).filter(Boolean);
          groups.forEach(g => {
            if (!stkMap[g]) stkMap[g] = [];
            stkMap[g].push({ source: 'workflow', name: t.name, project: w.name, role: t.phase || 'Workflow task', type: 'Workflow' });
          });
        }
      });
    }
    // Template stakeholders
    (w.template || []).forEach(t => {
      if (t.stakeholders) {
        const groups = t.stakeholders.split(',').map(x => x.trim()).filter(Boolean);
        groups.forEach(g => {
          if (!stkMap[g]) stkMap[g] = [];
          if (!stkMap[g].some(x => x.name === t.name && x.project === w.name)) {
            stkMap[g].push({ source: 'template', name: t.name, project: w.name + ' (template)', role: t.phase || '', type: 'Workflow' });
          }
        });
      }
    });
  });

  if (!Object.keys(stkMap).length) return '<div class="empty">No stakeholders recorded yet. Add stakeholder groups to tasks and projects.</div>';

  const sorted = Object.entries(stkMap).sort((a,b) => b[1].length - a[1].length);

  return sorted.map(([stk, deps]) => `
    <div class="stk-view-section">
      <h3>${av(stk, 26)} ${stk} <span style="font-size:11px;font-weight:400;color:var(--text-3)">${deps.length} involvement${deps.length > 1 ? 's' : ''}</span></h3>
      ${deps.map(d => `<div class="stk-dep-item">
        <span class="stk-dep-source badge ${d.type === 'Project' ? 's-ip' : d.type === 'Workflow' ? 's-rv' : 's-ns'}" style="font-size:10px">${d.type}</span>
        <div><div class="stk-dep-name">${d.name}</div><div style="font-size:11px;color:var(--text-3)">${d.project || ''}</div></div>
        <span class="stk-dep-role" style="font-size:11px;color:var(--text-2)">${d.role}</span>
      </div>`).join('')}
    </div>`).join('');
}

function addTeamMember(){
  const el = document.getElementById('new-member-name');
  if(!el) return;
  const name = el.value.trim();
  if(!name){ return; }
  if(!state.teamMembers) state.teamMembers = getTeamMembers();
  if(state.teamMembers.includes(name)){ showToast('Member already exists'); return; }
  state.teamMembers.push(name);
  save();
  el.value = '';
  openUserMgmt(); // refresh
  showToast(name + ' added to team');
}

function removeTeamMember(name){
  if(!name) return;
  if(!state.teamMembers) state.teamMembers = getTeamMembers();
  state.teamMembers = state.teamMembers.filter(m=>m!==name);
  save();
  openUserMgmt();
  showToast(name + ' removed from team');
}

const FR_WORDS=['le','la','les','un','une','des','est','sont','dans','avec','pour','sur','par','que','qui','pas','plus','très','nous','vous','ils','elles','mais','donc','aussi','comme','tout','cette','être','avoir','faire','aller','voir','venir','bien','même','encore','après','avant','depuis','pendant','selon','entre'];
function looksLikeFrench(text){if(!text||text.length<8)return false;const words=text.toLowerCase().split(/\s+/);const fr=words.filter(w=>FR_WORDS.includes(w.replace(/[^a-zàâéèêëîïôùûüç]/g,''))).length;const hasAccents=/[àâéèêëîïôùûüçÀÂÉÈÊËÎÏÔÙÛÜÇ]/.test(text);return hasAccents||(words.length>=3&&fr>=2);}
async function translateToEnglish(text){try{const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:'Translate the following French text to English. Reply with ONLY the English translation:\n\n'+text}]})});const data=await resp.json();return data.content?.[0]?.text?.trim()||null;}catch(e){return null;}}
async function translateTaskName(pid,tid,btnEl){const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;if(t.translatedName){delete t.translatedName;save();renderAdmin();return;}btnEl.textContent='Translating...';const result=await translateToEnglish(t.name);if(result){t.translatedName=result;save();renderAdmin();}else{btnEl.textContent='Failed';}}

function addSubtask(pid,tid){const n=document.getElementById('st_n_'+pid+'_'+tid)?.value.trim();if(!n)return;const p=state.projects.find(x=>x.id===pid);const t=p&&p.tasks.find(x=>x.id===tid);if(!t)return;if(!t.subtasks)t.subtasks=[];const maxId=t.subtasks.reduce((m,s)=>Math.max(m,s.id),0);t.subtasks.push({id:maxId+1,name:n,owner:document.getElementById('st_o_'+pid+'_'+tid)?.value||'',due:document.getElementById('st_d_'+pid+'_'+tid)?.value||'',done:false});document.getElementById('st_n_'+pid+'_'+tid).value='';save();renderAdmin();}

se</button><button class="btn btn-sm btn-primary" onclick="postThreadNote()">Post note</button></div></div></div></div>`;setTimeout(()=>{const b=document.getElementById('thread-body');if(b)b.scrollTop=b.scrollHeight;},50);}
function handleThreadInput(ta){const val=ta.value;const cursor=ta.selectionStart;const textBefore=val.slice(0,cursor);const atMatch=textBefore.match(/@([\w ]*)$/);const dd=document.getElementById('mention-dropdown');if(atMatch){const query=atMatch[1].toLowerCase();const matches=allOwners().filter(o=>o.toLowerCase().includes(query)&&o!==currentUser.name);if(matches.length){dd.style.display='block';dd.innerHTML=matches.map(m=>`<div class="mention-item" onmousedown="insertMention('${m}')">${av(m,22)} ${m}</div>`).join('');return;}}dd.style.display='none';}

function postThreadNote(){const ta=document.getElementById('thread-input-ta');if(!ta)return;const text=ta.value.trim();if(!text)return;const t=getThreadTask();if(!t)return;if(!t.taskNotes)t.taskNotes=[];const mentions=[];const re=/@([\w][\w .]+)/g;let m;while((m=re.exec(text))!==null){const name=m[1].trim();if(allOwners().includes(name)&&!mentions.includes(name))mentions.push(name);}const now=new Date();const ts=now.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+', '+now.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});const maxId=t.taskNotes.reduce((mx,n)=>Math.max(mx,n.id),0);const newNote={id:maxId+1,author:currentUser.name,text,ts,tagged:mentions};t.taskNotes.push(newNote);ta.value='';document.getElementById('mention-dropdown').style.display='none';save();renderThread();if(mentions.length)showToast('Note posted — tagged '+mentions.join(', '));else showToast('Note posted');}

function ragStatus(p){const tasks=p.tasks;if(!tasks.length)return 'amber';const blocked=tasks.filter(t=>t.status==='Blocked').length;const overdue=tasks.filter(t=>{if(!t.due||t.status==='Complete')return false;return new Date(t.due+'T00:00:00')<today;}).length;const pp=Math.round(tasks.filter(t=>t.status==='Complete').length/tasks.length*100);if(blocked>0||overdue>2)return 'red';if(overdue>0||pp<20)return 'amber';return 'green';}
function renderDashboard(){
  const allTasks=state.projects.flatMap(p=>p.tasks.map(t=>Object.assign({},t,{pName:p.name})));
  const now=new Date();now.setHours(0,0,0,0);const in7=new Date(now);in7.setDate(in7.getDate()+7);
  const dueSoon=allTasks.filter(t=>t.status!=='Complete'&&t.due&&new Date(t.due+'T00:00:00')<=in7&&new Date(t.due+'T00:00:00')>=now).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);
  const overdueTasks=allTasks.filter(t=>t.status!=='Complete'&&t.due&&new Date(t.due+'T00:00:00')<now);
  const blockedTasks=allTasks.filter(t=>t.status==='Blocked');
  const completed=allTasks.filter(t=>t.actualDate);
  const onTime=completed.filter(t=>{if(!t.due)return false;return new Date(t.actualDate+'T00:00:00')<=new Date(t.due+'T00:00:00');});
  const onTimePct=completed.length?Math.round(onTime.length/completed.length*100):null;
  const s=gStats();
  const ragRows=state.projects.map(p=>{const rag=ragStatus(p);const pp=pct(p.tasks);const bl=p.tasks.filter(t=>t.status==='Blocked').length;const ov=p.tasks.filter(t=>{if(!t.due||t.status==='Complete')return false;return new Date(t.due+'T00:00:00')<now;}).length;return`<div class="rag-row"><div class="rag-dot rag-${rag}"></div><span class="rag-name">${p.name}</span><span class="rag-meta">${pp}% done${bl?' · '+bl+' blocked':''}${ov?' · '+ov+' overdue':''}</span></div>`;}).join('');
  const dueRows=dueSoon.length?dueSoon.map(t=>`<div class="due-item"><div><div class="due-item-name">${t.name}</div><div class="due-item-proj">${t.pName}</div></div><span class="${dc(t.due,t.status)}">${fdShort(t.due)}</span></div>`).join(''):'<div style="font-size:13px;color:var(--text-3);padding:8px 0">No tasks due this week.</div>';
  const blockedRows=blockedTasks.length?blockedTasks.map(t=>`<div class="blocked-item"><span>🔴</span><div><div style="font-weight:500;font-size:13px">${t.name}</div><div style="font-size:11px;color:var(--text-3)">${t.pName}</div></div></div>`).join(''):'<div style="font-size:13px;color:var(--green);padding:8px 0">✓ No blocked tasks</div>';

  return`<div class="dash-grid">
    <div class="dash-section dash-grid-full"><div class="dash-stat-row">

      <div class="dash-stat"><div class="dash-stat-val">${s.tasks}</div><div class="dash-stat-label">Tasks</div></div>
      <div class="dash-stat"><div class="dash-stat-val" style="color:var(--green)">${allTasks.filter(t=>t.status==='Complete').length}</div><div class="dash-stat-label">Complete</div></div>

      <div class="dash-stat"><div class="dash-stat-val" style="color:var(--amber)">${overdueTasks.length}</div><div class="dash-stat-label">Overdue</div></div>

    </div></div>

function reopenCycle(wid,cycleId){const w=state.workflows.find(x=>x.id===wid);if(!w)return;const idx=(w.history||[]).findIndex(c=>c.id===cycleId);if(idx<0)return;if(!confirm('Reopen this cycle as active?'))return;const toReopen=w.history.splice(idx,1)[0];delete toReopen.closed;delete toReopen.closedBy;if(w.cycles&&w.cycles.length){w.cycles[0].closed=new Date().toISOString().slice(0,10);w.history.unshift(w.cycles[0]);}w.cycles=[toReopen];save();renderAdmin();showToast('Cycle reopened');}
