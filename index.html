// ── Gantt chart ───────────────────────────────────────────────────────────────
function renderGantt(p){
  const tasks=p.tasks.filter(t=>t.due);
  if(!tasks.length)return`<div class="empty">No tasks with dates to show.</div>`;
  const dates=tasks.map(t=>new Date(t.due+'T00:00:00'));
  const minD=new Date(Math.min(...dates));const maxD=new Date(Math.max(...dates));
  minD.setDate(minD.getDate()-2);maxD.setDate(maxD.getDate()+2);
  const totalMs=maxD-minD;
  const months=[];let cur=new Date(minD);
  while(cur<=maxD){const label=cur.toLocaleDateString('en-IE',{month:'short',year:'2-digit'});if(!months.length||months[months.length-1].label!==label)months.push({label,date:new Date(cur)});cur.setDate(cur.getDate()+1);}
  const monthHeaders=months.map(m=>{const pct=Math.round((m.date-minD)/totalMs*100);return`<div style="position:absolute;left:${pct}%;font-size:10px;color:var(--text-3);white-space:nowrap;font-family:var(--mono)">${m.label}</div>`;}).join('');
  const bars=tasks.map(t=>{
    const d=new Date(t.due+'T00:00:00');
    const start=new Date(d);start.setDate(start.getDate()-3);
    const sp=Math.max(0,Math.round((start-minD)/totalMs*100));
    const ep=Math.min(100,Math.round((d-minD)/totalMs*100));
    const w=Math.max(1,ep-sp);
    const done=t.status==='Complete';
    const blocked=t.status==='Blocked';
    const color=done?'var(--green)':blocked?'var(--red)':t.status==='In progress'?'var(--blue-2)':'var(--blue-light)';
    const textColor=done||blocked||t.status==='In progress'?'#fff':'var(--navy)';
    return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px">
      <div style="width:180px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${t.name}</div>
      <div style="flex:1;position:relative;height:22px">
        <div style="position:absolute;left:${sp}%;width:${w}%;height:100%;background:${color};border-radius:3px;display:flex;align-items:center;padding:0 6px;overflow:hidden">
          <span style="font-size:10px;color:${textColor};white-space:nowrap">${fdShort(t.due)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  return`<div style="padding:12px 0">
    <div style="position:relative;height:20px;margin-left:188px;margin-bottom:8px">${monthHeaders}</div>
    ${bars}
  </div>`;
}

// ── Time log ──────────────────────────────────────────────────────────────────
function renderTimeLog(p){
  const tasks=p.tasks.filter(t=>(t.estHrs||0)>0||(t.loggedHrs||0)>0);
  if(!tasks.length)return`<div class="empty">No time estimates logged yet. Add estimated hours to tasks to see them here.</div>`;
  const totalEst=tasks.reduce((a,t)=>a+(t.estHrs||0),0);
  const totalLog=tasks.reduce((a,t)=>a+(t.loggedHrs||0),0);
  const rows=tasks.map(t=>{
    const pctDone=t.estHrs?Math.min(100,Math.round((t.loggedHrs||0)/t.estHrs*100)):0;
    const over=(t.loggedHrs||0)>(t.estHrs||0);
    return`<tr>
      <td style="padding:7px 8px;border-bottom:0.5px solid var(--border);font-size:13px">${t.name}</td>
      <td style="padding:7px 8px;border-bottom:0.5px solid var(--border);font-size:13px;text-align:center">${fh(t.estHrs||0)}</td>
      <td style="padding:7px 8px;border-bottom:0.5px solid var(--border);font-size:13px;text-align:center"><span class="${over?'time-chip over':'time-chip'}">${fh(t.loggedHrs||0)}</span></td>
      <td style="padding:7px 8px;border-bottom:0.5px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden">
            <div style="width:${pctDone}%;height:100%;background:${over?'var(--red)':'var(--green)'};border-radius:99px"></div>
          </div>
          <span style="font-size:11px;color:var(--text-3);min-width:30px">${pctDone}%</span>
        </div>
      </td>
      <td style="padding:7px 8px;border-bottom:0.5px solid var(--border);text-align:right">
        <button class="btn btn-sm" style="font-size:11px" onclick="openLog(${p.id},${t.id})">Log time</button>
      </td>
    </tr>`;
  }).join('');
  return`<div style="padding:8px 0">
    <div style="display:flex;gap:16px;margin-bottom:16px">
      <div class="sc"><div class="sc-label">Est. total</div><div class="sc-val">${fh(totalEst)}</div></div>
      <div class="sc"><div class="sc-label">Logged total</div><div class="sc-val">${fh(totalLog)}</div></div>
      <div class="sc"><div class="sc-label">Remaining</div><div class="sc-val" style="color:${totalLog>totalEst?'var(--red)':'var(--green)'}">${fh(Math.max(0,totalEst-totalLog))}</div></div>
    </div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--bg)">
        <th style="text-align:left;padding:6px 8px;font-size:11px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border)">Task</th>
        <th style="text-align:center;padding:6px 8px;font-size:11px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border)">Estimated</th>
        <th style="text-align:center;padding:6px 8px;font-size:11px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border)">Logged</th>
        <th style="padding:6px 8px;font-size:11px;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border)">Progress</th>
        <th style="border-bottom:1px solid var(--border)"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Workflow timeline ─────────────────────────────────────────────────────────
function renderWorkflowTimeline(w){
  const ac=activeCycle(w);
  const tasks=ac?ac.tasks:w.template;
  const isTemplate=!ac;
  const phases=['Setup / Kickoff','Bookings & Inputs','Reviews','Exec Reviews','Finalise & Board'];
  const grouped={};phases.forEach(ph=>grouped[ph]=[]);
  tasks.forEach(t=>{const ph=t.phase||'Setup / Kickoff';if(grouped[ph])grouped[ph].push(t);else{if(!grouped['Other'])grouped['Other']=[];grouped['Other'].push(t);}});
  const phaseColors={'Setup / Kickoff':'#4A5878','Bookings & Inputs':'var(--blue-2)','Reviews':'#EF9F27','Exec Reviews':'var(--red)','Finalise & Board':'var(--green)'};
  const phaseSections=[...phases,grouped['Other']?'Other':''].filter(ph=>ph&&(grouped[ph]||[]).length>0).map(ph=>{
    const ptasks=(grouped[ph]||[]).sort((a,b)=>(a.relDay||0)-(b.relDay||0));
    const cards=ptasks.map(t=>{
      const dateStr=isTemplate?(t.relDay===0?'Anchor day':t.relDay>0?`Day +${t.relDay}`:`Day ${t.relDay}`):(t.due?fdShort(t.due):`Day ${t.relDay>=0?'+':''}${t.relDay}`);
      const meetingHtml=t.meetingNeeded?`<span style="font-size:10px;background:${t.meetingSetup?'var(--green-bg,#E4F5EE)':'var(--amber-bg,#FDF2DC)'};color:${t.meetingSetup?'var(--green)':'var(--amber)'};border-radius:99px;padding:1px 6px">${t.meetingSetup?'✓ Meeting set':'⚠ Needs meeting'}</span>`:'';
      const statusHtml=!isTemplate&&t.status?`<span class="badge ${scls(t.status)}" style="font-size:10px">${t.status}</span>`:'';
      return`<div class="wf-tl-card ${phaseClass(ph)}" style="break-inside:avoid">
        <div class="wf-tl-card-name">${t.name}</div>
        <div class="wf-tl-card-meta">
          <span class="wf-tl-day">${dateStr}</span>
          ${geoBadge(t.geo||'Group')}
          ${meetingHtml}${statusHtml}
        </div>
        ${t.stakeholders?`<div style="font-size:10px;color:var(--text-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.stakeholders}">${t.stakeholders}</div>`:''}
      </div>`;
    }).join('');
    return`<div class="wf-phase-group">
      <div class="wf-phase-label"><span style="width:10px;height:10px;border-radius:50%;background:${phaseColors[ph]||'var(--navy)'};display:inline-block;flex-shrink:0"></span>${ph} <span style="color:var(--text-3)">(${ptasks.length})</span></div>
      <div class="wf-timeline-grid">${cards}</div>
    </div>`;
  }).join('');
  const total=tasks.length;const needsMeeting=tasks.filter(t=>t.meetingNeeded&&!t.meetingSetup).length;
  return`<div class="wf-timeline-wrap">
    <div class="wf-timeline-header">
      <div>
        <div class="wf-timeline-title">${ac?ac.label:w.name+' — Template'}</div>
        <div class="wf-timeline-sub">${w.name} · ${total} tasks · ${ac?'Anchor: '+fdShort(ac.anchor):'Template view'}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${needsMeeting?`<span class="badge s-rv" style="font-size:12px">⚠ ${needsMeeting} meetings to set up</span>`:''}
        <button class="print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
      </div>
    </div>
    ${phaseSections}
  </div>`;
}

function phaseClass(phase){
  return{'Setup / Kickoff':'phase-setup','Bookings & Inputs':'phase-bookings','Reviews':'phase-reviews','Exec Reviews':'phase-exec','Finalise & Board':'phase-finalise'}[phase]||'phase-setup';
}

// ── Workflow Gantt ────────────────────────────────────────────────────────────
function renderWorkflowGantt(w, ac){
  if(!ac || !ac.tasks || !ac.tasks.length){
    return`<div class="empty" style="padding:32px">No active cycle to display. Start a new cycle to see the Gantt view.</div>`;
  }

  const tasks = ac.tasks.filter(t=>t.due);
  if(!tasks.length) return`<div class="empty">No tasks with dates.</div>`;

  // Date range
  const dates = tasks.map(t=>new Date(t.due+'T00:00:00'));
  const minD = new Date(Math.min(...dates));
  const maxD = new Date(Math.max(...dates));
  minD.setDate(minD.getDate()-3);
  maxD.setDate(maxD.getDate()+5);
  const totalMs = maxD - minD;

  // Build month markers
  const months = [];
  let cur = new Date(minD);
  while(cur <= maxD){
    const label = cur.toLocaleDateString('en-IE',{month:'short',year:'2-digit'});
    if(!months.length || months[months.length-1].label !== label){
      months.push({label, pct: Math.round((cur-minD)/totalMs*100)});
    }
    cur.setDate(cur.getDate()+1);
  }

  // Today marker
  const todayPct = Math.min(100,Math.max(0,Math.round((today-minD)/totalMs*100)));
  const showToday = todayPct > 0 && todayPct < 100;

  // Group tasks by phase
  const phases = ['Setup / Kickoff','Bookings & Inputs','Reviews','Exec Reviews','Finalise & Board'];
  const phaseColors = {
    'Setup / Kickoff':'#4A5878',
    'Bookings & Inputs':'var(--blue-2)',
    'Reviews':'#EF9F27',
    'Exec Reviews':'var(--red)',
    'Finalise & Board':'var(--green)'
  };

  // Sort tasks by due date then phase
  const sorted = [...tasks].sort((a,b)=>{
    const pa = phases.indexOf(a.phase||'');
    const pb = phases.indexOf(b.phase||'');
    if(pa !== pb) return pa - pb;
    return a.due.localeCompare(b.due);
  });

  const bars = sorted.map(t=>{
    const d = new Date(t.due+'T00:00:00');
    // Bar spans 3 working days ending on due date
    const startD = new Date(d);
    startD.setDate(startD.getDate()-3);
    const sp = Math.max(0, Math.round((startD-minD)/totalMs*100));
    const ep = Math.min(100, Math.round((d-minD)/totalMs*100));
    const w2 = Math.max(0.5, ep-sp);

    const done = t.status==='Complete';
    const blocked = t.status==='Blocked';
    const inProg = t.status==='In progress';
    const phaseColor = phaseColors[t.phase||''] || 'var(--blue-2)';
    const barColor = done?'var(--green)':blocked?'var(--red)':inProg?phaseColor:'var(--blue-light)';
    const barTextColor = done||blocked||inProg?'#fff':'var(--navy)';
    const meetingIcon = t.meetingNeeded?(t.meetingSetup?'✓':'⚠'):'';

    return`<div style="display:flex;align-items:center;gap:0;margin-bottom:3px">
      <div style="width:220px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding-right:10px">
        ${phaseBadge(t.phase||'')}
        <span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)" title="${t.name}">${t.name}</span>
      </div>
      <div style="flex:1;position:relative;height:24px">
        <div style="position:absolute;left:${sp}%;width:${w2}%;height:100%;background:${barColor};border-radius:3px;display:flex;align-items:center;padding:0 6px;min-width:2px;overflow:hidden;transition:width 0.2s">
          <span style="font-size:10px;color:${barTextColor};white-space:nowrap">${fdShort(t.due)} ${meetingIcon}</span>
        </div>
        ${done?`<div style="position:absolute;left:${ep}%;transform:translateX(-50%);top:50%;transform:translateY(-50%) translateX(-50%);font-size:12px">✓</div>`:''}
      </div>
      <div style="width:80px;flex-shrink:0;text-align:right">
        <span class="badge ${scls(t.status)}" style="font-size:10px">${t.status}</span>
      </div>
    </div>`;
  }).join('');

  // Summary stats
  const complete = tasks.filter(t=>t.status==='Complete').length;
  const inProgress = tasks.filter(t=>t.status==='In progress').length;
  const blocked2 = tasks.filter(t=>t.status==='Blocked').length;
  const needsMeeting = tasks.filter(t=>t.meetingNeeded&&!t.meetingSetup).length;

  return`<div style="padding:16px 0">
    <!-- Summary stats -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <div class="sc"><div class="sc-label">Cycle</div><div class="sc-val" style="font-size:14px">${ac.label}</div></div>
      <div class="sc"><div class="sc-label">Tasks</div><div class="sc-val">${tasks.length}</div></div>
      <div class="sc"><div class="sc-label">Complete</div><div class="sc-val" style="color:var(--green)">${complete}</div></div>
      <div class="sc"><div class="sc-label">In progress</div><div class="sc-val" style="color:var(--blue-2)">${inProgress}</div></div>
      ${blocked2?`<div class="sc"><div class="sc-label">Blocked</div><div class="sc-val" style="color:var(--red)">${blocked2}</div></div>`:''}
      ${needsMeeting?`<div class="sc"><div class="sc-label">Meetings ⚠</div><div class="sc-val" style="color:var(--amber)">${needsMeeting}</div></div>`:''}
      <div class="sc"><div class="sc-label">Anchor</div><div class="sc-val" style="font-size:13px">${fdShort(ac.anchor)}</div></div>
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:11px;color:var(--text-2)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--green);border-radius:2px;display:inline-block"></span>Complete</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--blue-2);border-radius:2px;display:inline-block"></span>In progress</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--red);border-radius:2px;display:inline-block"></span>Blocked</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--blue-light);border-radius:2px;display:inline-block"></span>Not started</span>
      <span>⚠ = meeting not set up</span>
    </div>

    <!-- Month headers -->
    <div style="display:flex;align-items:center;gap:0;margin-bottom:6px">
      <div style="width:220px;flex-shrink:0"></div>
      <div style="flex:1;position:relative;height:18px">
        ${months.map(m=>`<div style="position:absolute;left:${m.pct}%;font-size:10px;color:var(--text-3);white-space:nowrap;font-family:var(--mono)">${m.label}</div>`).join('')}
        ${showToday?`<div style="position:absolute;left:${todayPct}%;top:0;bottom:-${sorted.length*27+10}px;width:1px;background:var(--red);opacity:0.4;z-index:1"></div>`:''}
      </div>
      <div style="width:80px;flex-shrink:0"></div>
    </div>

    <!-- Bars -->
    <div style="position:relative">
      ${showToday?`<div style="position:absolute;left:calc(220px + ${todayPct}% * (100% - 300px) / 100);top:0;bottom:0;width:1px;background:var(--red);opacity:0.3;z-index:1;pointer-events:none"></div>`:''}
      ${bars}
    </div>

    <!-- Print button -->
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
      <button class="print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div>`;
}

</script>
</body>
</html>
